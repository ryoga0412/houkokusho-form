<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報告書作成くん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --brand:#0E6B4C; --brand-lt:#E4F1EA; --ink:#1B2320; --dim:#8A9790;
    --line:#E4E9E5; --bg:#F7F8F6; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;
       padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 32px}
  header{background:var(--white);border-bottom:1px solid var(--line);padding:14px 18px}
  header h1{font-size:17px;font-weight:700}
  .ctx{background:var(--brand-lt);padding:11px 18px}
  .ctx .k{font-size:10px;font-weight:700;color:var(--brand);letter-spacing:.08em}
  .ctx .v{font-size:14px;margin-top:2px}
  main{padding:18px}
  label.fl{display:block;font-size:12px;font-weight:700;color:var(--dim);
           margin:20px 0 7px;letter-spacing:.04em}
  label.fl:first-child{margin-top:0}
  label.fl em{font-style:normal;font-weight:500;color:#B4BEB7}
  input[type=text],input[type=date],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;
    font-size:15px;font-family:inherit;color:var(--ink);background:var(--white);
    line-height:1.6;-webkit-appearance:none;appearance:none}
  textarea{min-height:82px;resize:vertical}
  input::placeholder,textarea::placeholder{color:#AEB8B1}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:-2px}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
         linear-gradient(135deg,var(--dim) 50%,transparent 50%);
         background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
         background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .two{display:flex;gap:9px;align-items:center}
  .two input{flex:1;min-width:0}
  .two span{color:var(--dim);font-size:13px;flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--white);border-radius:999px;
        padding:9px 16px;font-size:13.5px;color:#56655C;cursor:pointer;user-select:none}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  .day{border:1px solid var(--line);border-radius:9px;overflow:hidden;
       margin-bottom:9px;background:var(--white)}
  .day-h{background:#F5F8F6;border-bottom:1px solid var(--line);
         padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--brand)}
  .day textarea{border:none;border-radius:0;min-height:74px}
  .day textarea:focus{outline-offset:-2px}
  .seg{border:1px solid var(--line);border-radius:9px;background:var(--white);
       padding:11px;margin-bottom:9px}
  .seg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .seg-h b{font-size:12px;color:var(--dim)}
  .seg-h button{background:none;border:none;color:#B26B5E;font-size:12px;
                font-family:inherit;cursor:pointer;padding:2px 4px}
  .seg .row{display:flex;gap:8px}
  .seg .row input{flex:3;min-width:0}
  .seg .row select{flex:2;min-width:0}
  .add{border:1px dashed #BFD8CB;color:var(--brand);border-radius:9px;padding:11px;
       text-align:center;font-size:13px;font-weight:700;background:none;width:100%;
       font-family:inherit;cursor:pointer}
  .hide{display:none !important}
  .submit{width:100%;background:var(--brand);color:#fff;border:none;border-radius:10px;
          padding:15px;font-size:16px;font-weight:700;font-family:inherit;
          margin-top:26px;cursor:pointer}
  .submit:disabled{background:#A9BFB4}
  .hint{font-size:11.5px;color:var(--dim);margin-top:9px;text-align:center}
  .msg{margin:18px;padding:14px;border-radius:10px;background:#FBEDE9;
       color:#8C4A3C;font-size:13.5px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">読み込み中…</h1></header>
  <div class="ctx hide" id="ctx">
    <div class="k">旅費申請でお預かりした出張</div>
    <div class="v" id="ctxv"></div>
  </div>

  <div class="msg hide" id="msg"></div>

  <main class="hide" id="form">

    <!-- ===== 旅費申請 ===== -->
    <div id="expense" class="hide">
      <label class="fl">出張期間</label>
      <div class="two">
        <input type="date" id="e_from"><span>〜</span><input type="date" id="e_to">
      </div>

      <label class="fl">出張先</label>
      <select id="e_place"></select>
      <input type="text" id="e_city" placeholder="市区町村・都市名（任意）" style="margin-top:8px">

      <label class="fl">移動手段</label>
      <div class="chips" id="e_means"></div>

      <div id="e_segwrap" class="hide">
        <label class="fl">区間 <em>／ 往路・復路をそれぞれ</em></label>
        <div id="e_segs"></div>
        <button type="button" class="add" id="e_addseg">＋ 区間を追加</button>
      </div>

      <label class="fl">宿泊先 <em>／ 日帰りなら空欄</em></label>
      <input type="text" id="e_hotel" placeholder="ホテル名">

      <label class="fl">精算について</label>
      <div class="chips" id="e_settle"></div>
    </div>

    <!-- ===== 出張報告 ===== -->
    <div id="report" class="hide">
      <label class="fl">目的 <em>／ 空欄でも構いません</em></label>
      <input type="text" id="r_purpose" placeholder="未入力の場合は下の内容から作成します">

      <label class="fl">日ごとの出張内容</label>
      <div id="r_days"></div>

      <label class="fl">訪問先・お会いした方 <em>／ 任意</em></label>
      <div id="r_visits"></div>
      <button type="button" class="add" id="r_addvisit">＋ 訪問先を追加</button>

      <label class="fl">決まったこと・成果</label>
      <textarea id="r_result" placeholder="単価改定は4月から／見積りは今月中に受領　など"></textarea>
    </div>

    <button type="button" class="submit" id="send">この内容で送る</button>
    <div class="hint">送信後、足りないところだけLINEでお伺いします。</div>
  </main>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LIFF_ID = '2011518319-ABM6yIOM';

  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (p) {
    if (!p) return;
    var i = p.indexOf('=');
    q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' '));
  });
  var mode = (q.t === 'report') ? 'report' : 'expense';

  var PREF = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県',
    '埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県',
    '岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県',
    '鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県',
    '佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県','海外'];

  var MEANS = ['飛行機','新幹線','在来線','自家用車','レンタカー','タクシー','バス'];
  var CLASS_AIR_JAL = ['エコノミー','クラスJ','ファースト'];
  var CLASS_AIR_OTH = ['エコノミー','ビジネス','ファースト'];
  var CLASS_TRAIN   = ['自由席','指定席','グリーン','グランクラス'];

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).trim(); };

  function jp(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return '';
    return m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日';
  }
  function md(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return '';
    var w = ['日','月','火','水','木','金','土'][new Date(m[1], m[2] - 1, m[3]).getDay()];
    return Number(m[2]) + '月' + Number(m[3]) + '日（' + w + '）';
  }
  function days(from, to) {
    var out = [];
    if (!from) return out;
    var d = new Date(from), e = new Date(to || from);
    if (isNaN(d) || isNaN(e) || e < d) return [from];
    for (var i = 0; i < 62 && d <= e; i++) {
      out.push(d.toISOString().slice(0, 10));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  /* ---------- 旅費申請 ---------- */
  function buildExpense() {
    $('title').textContent = '旅費申請';
    $('expense').classList.remove('hide');

    var sel = $('e_place');
    sel.appendChild(new Option('選択してください', ''));
    PREF.forEach(function (p) { sel.appendChild(new Option(p, p)); });

    chips($('e_means'), MEANS, true, function () {
      var on = picked($('e_means'));
      var needSeg = on.indexOf('飛行機') >= 0 || on.indexOf('新幹線') >= 0;
      $('e_segwrap').classList.toggle('hide', !needSeg);
      if (needSeg && !$('e_segs').children.length) { addSeg('往路'); addSeg('復路'); }
    });

    chips($('e_settle'), ['通常どおり精算する','移動の精算は不要','宿泊の精算は不要'], true);

    $('e_addseg').onclick = function () { addSeg(''); };
  }

  function addSeg(label) {
    var wrap = document.createElement('div');
    wrap.className = 'seg';
    var n = $('e_segs').children.length + 1;
    wrap.innerHTML =
      '<div class="seg-h"><b>' + (label || ('区間 ' + n)) + '</b>' +
      '<button type="button">削除</button></div>' +
      '<div class="row"><input type="text" placeholder="便名・列車名（JAL031／のぞみ）">' +
      '<select></select></div>';
    var sel = wrap.querySelector('select');
    var inp = wrap.querySelector('input');
    function fill() {
      var v = inp.value.toUpperCase();
      var list = /^(JL|JAL)/.test(v) ? CLASS_AIR_JAL
               : /(のぞみ|ひかり|こだま|みずほ|さくら|つばめ|はやぶさ|こまち|やまびこ|かがやき|はくたか|あさま|とき)/.test(inp.value) ? CLASS_TRAIN
               : CLASS_AIR_OTH;
      var cur = sel.value;
      sel.innerHTML = '';
      sel.appendChild(new Option('座席クラス', ''));
      list.forEach(function (c) { sel.appendChild(new Option(c, c)); });
      if (cur) sel.value = cur;
    }
    inp.addEventListener('input', fill);
    fill();
    wrap.querySelector('button').onclick = function () { wrap.remove(); };
    $('e_segs').appendChild(wrap);
  }

  function expenseText() {
    var from = $('e_from').value, to = $('e_to').value;
    if (!from) return { err: '出張期間の開始日を選んでください。' };
    var place = $('e_place').value;
    if (!place) return { err: '出張先を選んでください。' };
    var city = esc($('e_city').value);

    var L = ['【旅費申請】'];
    L.push('出張期間：' + (!to || to === from ? jp(from) + '（日帰り）' : jp(from) + '〜' + jp(to)));
    L.push('出張先：' + place + (city ? ' ' + city : ''));

    var means = picked($('e_means'));
    L.push('移動手段：' + (means.length ? means.join('・') : '未記入'));

    var segs = [];
    Array.prototype.forEach.call($('e_segs').children, function (w) {
      var name = esc(w.querySelector('input').value);
      var cls  = w.querySelector('select').value;
      if (name) segs.push(name + (cls ? '（' + cls + '）' : ''));
    });
    if (segs.length) L.push('区間：' + segs.join('／'));

    var hotel = esc($('e_hotel').value);
    L.push('宿泊先：' + (hotel || 'なし（日帰り）'));

    var st = picked($('e_settle')).filter(function (s) { return s !== '通常どおり精算する'; });
    if (st.length) L.push('精算：' + st.join('・'));

    return { text: L.join('\n') };
  }

  /* ---------- 出張報告 ---------- */
  function buildReport() {
    $('title').textContent = '出張報告';

    var from = q.from || '', to = q.to || from, place = q.place || '';
    if (from || place) {
      $('ctx').classList.remove('hide');
      $('ctxv').textContent =
        (from ? (jp(from) + (to && to !== from ? '〜' + jp(to) : '')) : '') +
        (place ? '　' + place : '');
    }

    var list = days(from, to);
    if (!list.length) list = [''];
    list.forEach(function (d, i) {
      var box = document.createElement('div');
      box.className = 'day';
      box.innerHTML = '<div class="day-h">' + (d ? md(d) : ('その日にされたこと ' + (i + 1))) + '</div>' +
                      '<textarea placeholder="この日にされたことを書いてください"></textarea>';
      box.setAttribute('data-d', d ? md(d) : '');
      $('r_days').appendChild(box);
    });

    addVisit();
    $('r_addvisit').onclick = function () { addVisit(); };
    $('report').classList.remove('hide');
  }

  function addVisit() {
    var i = document.createElement('input');
    i.type = 'text';
    i.placeholder = '株式会社〇〇　購買部 田中様';
    i.style.marginBottom = '8px';
    $('r_visits').appendChild(i);
  }

  function reportText() {
    var L = ['【出張報告】'];
    var pur = esc($('r_purpose').value);
    if (pur) L.push('目的：' + pur);

    var any = false, body = [];
    Array.prototype.forEach.call($('r_days').children, function (box) {
      var t = esc(box.querySelector('textarea').value);
      if (!t) return;
      any = true;
      var d = box.getAttribute('data-d');
      body.push(d ? '【' + d + '】\n' + t : t);
    });
    if (!any) return { err: '出張内容を1日分以上ご記入ください。' };
    L.push('出張内容：');
    L.push(body.join('\n'));

    var vs = [];
    Array.prototype.forEach.call($('r_visits').children, function (i) {
      var v = esc(i.value); if (v) vs.push(v);
    });
    if (vs.length) L.push('訪問先：' + vs.join('／'));

    var r = esc($('r_result').value);
    if (r) L.push('成果：' + r);

    return { text: L.join('\n') };
  }

  /* ---------- 共通 ---------- */
  function chips(host, list, multi, onchange) {
    list.forEach(function (t) {
      var b = document.createElement('div');
      b.className = 'chip';
      b.textContent = t;
      b.onclick = function () {
        if (!multi) Array.prototype.forEach.call(host.children, function (c) { c.classList.remove('on'); });
        b.classList.toggle('on');
        if (onchange) onchange();
      };
      host.appendChild(b);
    });
  }
  function picked(host) {
    var out = [];
    Array.prototype.forEach.call(host.children, function (c) {
      if (c.classList.contains('on')) out.push(c.textContent);
    });
    return out;
  }
  function show(t) { var m = $('msg'); m.textContent = t; m.classList.remove('hide'); }

  /* ---------- 起動 ---------- */
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isInClient()) {
      show('このページはLINEアプリの中で開いてください。');
      return;
    }
    if (mode === 'report') buildReport(); else buildExpense();
    $('form').classList.remove('hide');

    $('send').onclick = function () {
      var r = (mode === 'report') ? reportText() : expenseText();
      if (r.err) { alert(r.err); return; }
      $('send').disabled = true;
      $('send').textContent = '送信中…';
      liff.sendMessages([{ type: 'text', text: r.text }])
        .then(function () { liff.closeWindow(); })
        .catch(function (e) {
          $('send').disabled = false;
          $('send').textContent = 'この内容で送る';
          show('送信できませんでした。もう一度お試しください。（' + e + '）');
        });
    };
  }).catch(function (e) {
    show('起動に失敗しました。（' + e + '）');
  });
})();
</script>
</body>
</html>
