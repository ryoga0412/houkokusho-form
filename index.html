<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報告書作成くん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{--brand:#0E6B4C;--brand-lt:#E4F1EA;--ink:#1B2320;--dim:#8A9790;
        --line:#E4E9E5;--bg:#F7F8F6;--white:#fff}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
  .wrap{max-width:560px;margin:0 auto;padding-bottom:36px}
  header{background:var(--white);border-bottom:1px solid var(--line);padding:14px 18px}
  header h1{font-size:17px;font-weight:700}
  .ctx{background:var(--brand-lt);padding:11px 18px}
  .ctx .k{font-size:10px;font-weight:700;color:var(--brand);letter-spacing:.08em}
  .ctx .v{font-size:14px;margin-top:2px}
  main{padding:18px}
  .fl{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:22px 0 7px;letter-spacing:.04em}
  .fl:first-child{margin-top:0}
  #e_staybox .fl{margin-top:22px}
  .fl em{font-style:normal;font-weight:500;color:#B4BEB7}
  input[type=text],input[type=date],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:15px;
    font-family:inherit;color:var(--ink);background:var(--white);line-height:1.6;
    -webkit-appearance:none;appearance:none}
  textarea{min-height:84px;resize:vertical}
  input::placeholder,textarea::placeholder{color:#AEB8B1}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:-2px}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
    linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}

  /* 日付を選ぶボタン。1回タップでカレンダーが開き、そこで期間まで決める */
  .dfield{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 38px 12px 12px;
          font-size:15px;font-family:inherit;color:var(--ink);background:var(--white);
          text-align:left;line-height:1.6;cursor:pointer;position:relative;display:block}
  .dfield.empty{color:#AEB8B1}
  .dfield:after{content:'';position:absolute;right:14px;top:50%;width:13px;height:13px;
    margin-top:-8px;border:1.6px solid var(--dim);border-radius:2px}
  .dfield:before{content:'';position:absolute;right:16px;top:50%;width:9px;height:1.6px;
    margin-top:-4px;background:var(--dim);z-index:1}

  .two{display:flex;gap:9px;align-items:center}
  .two>*{flex:1;min-width:0}
  .two span{flex:none;color:var(--dim);font-size:13px}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--white);
        padding:12px;margin-bottom:10px}
  .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .card-h b{font-size:12px;color:var(--dim);font-weight:700}
  .card-h button{background:none;border:none;color:#B26B5E;font-size:12px;
                 font-family:inherit;cursor:pointer;padding:2px 4px}
  .card>*+*{margin-top:8px}
  .add{border:1px dashed #BFD8CB;color:var(--brand);border-radius:9px;padding:11px;
       text-align:center;font-size:13px;font-weight:700;background:none;width:100%;
       font-family:inherit;cursor:pointer}
  .seg2{display:flex;background:var(--white);border:1px solid var(--line);
        border-radius:9px;overflow:hidden}
  .seg2 div{flex:1;text-align:center;padding:11px 6px;font-size:13.5px;
            color:#56655C;cursor:pointer;user-select:none}
  .seg2 div.on{background:var(--brand);color:#fff;font-weight:700}
  /* 手段・座席クラス・支払（タップで選ぶ） */
  .segb{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--white)}
  .segb button{flex:1;border:none;background:none;padding:10px 2px;font-size:13.5px;font-family:inherit;
               color:#56655C;cursor:pointer;white-space:nowrap}
  .segb button+button{border-left:1px solid var(--line)}
  .segb button.on{background:var(--brand);color:#fff;font-weight:700}
  .mini{display:block;font-size:11px;color:var(--dim);font-weight:700}
  .card>.mini+*{margin-top:4px}
  /* 自動で入った欄（さわると元の色に戻る） */
  .auto,.segb.auto{background:#FFF6D8 !important}
  .bad{outline:2px solid #B26B5E !important;outline-offset:-2px}
  /* 往復ボタン */
  .rt{width:100%;border:1.5px solid var(--brand);background:var(--white);color:var(--brand);
      border-radius:10px;padding:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  /* 最近使った場所 */
  .chips-l{display:block;font-size:11px;color:var(--dim)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chips button{border:none;background:var(--brand-lt);color:var(--brand);border-radius:14px;padding:5px 12px;
                font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
  .day{border:1px solid var(--line);border-radius:9px;overflow:hidden;
       margin-bottom:9px;background:var(--white)}
  .day-h{background:#F5F8F6;border-bottom:1px solid var(--line);padding:8px 12px;
         font-size:12.5px;font-weight:700;color:var(--brand)}
  .day textarea{border:none;border-radius:0;min-height:76px}
  .hide{display:none !important}
  .submit{width:100%;background:var(--brand);color:#fff;border:none;border-radius:10px;
          padding:15px;font-size:16px;font-weight:700;font-family:inherit;margin-top:28px;cursor:pointer}
  .submit:disabled{background:#A9BFB4}
  .hint{font-size:11.5px;color:var(--dim);margin-top:9px;text-align:center}
  .msg{margin:18px;padding:14px;border-radius:10px;background:#FBEDE9;color:#8C4A3C;
       font-size:13.5px;line-height:1.8}

  /* カレンダー */
  .sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:50;
         display:flex;align-items:flex-end;justify-content:center}
  .sheet-in{background:var(--white);width:100%;max-width:560px;
            border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-h b{font-size:15px}
  .cal-h button{border:none;background:var(--brand-lt);color:var(--brand);width:38px;height:38px;
                border-radius:19px;font-size:20px;line-height:1;font-family:inherit;cursor:pointer}
  .cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-w span{text-align:center;font-size:11px;color:var(--dim);padding-bottom:4px}
  .cal-w span:first-child{color:#C4726A}
  .cal-w span:last-child{color:#6A86C4}
  .cd{height:42px;display:flex;align-items:center;justify-content:center;font-size:14.5px;
      cursor:pointer;border-radius:21px;position:relative}
  .cd.empty{cursor:default}
  .cd.mid{background:var(--brand-lt);border-radius:0}
  .cd.on{background:var(--brand);color:#fff;font-weight:700}
  .cd.on.s{border-radius:21px 0 0 21px}
  .cd.on.e{border-radius:0 21px 21px 0}
  .cd.on.s.e{border-radius:21px}
  .cal-sel{text-align:center;font-size:13px;color:var(--dim);margin:12px 0 10px;min-height:22px}
  .cal-sel b{color:var(--ink);font-size:14.5px}
  .cal-btns{display:flex;gap:9px}
  .cal-btns button{flex:1;border:none;border-radius:10px;padding:13px;font-size:15px;
                   font-weight:700;font-family:inherit;cursor:pointer}
  #cal_cancel{background:#EEF1EF;color:#56655C}
  #cal_ok{background:var(--brand);color:#fff}
  #cal_ok:disabled{background:#A9BFB4}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">読み込み中…</h1></header>
  <div class="ctx hide" id="ctx">
    <div class="k">旅費申請でお預かりした出張</div>
    <div class="v" id="ctxv"></div>
  </div>
  <div class="msg hide" id="msg"></div>

  <main class="hide" id="form">

    <!-- 旅費申請 -->
    <div id="expense" class="hide">
      <span class="fl">出張期間 <em>／ 日帰りは同じ日をもう一度</em></span>
      <button type="button" class="dfield empty" id="e_period">日付を選ぶ</button>

      <span class="fl">出張先</span>
      <input type="text" id="e_place" placeholder="品川／ゴルフ場名／現場名">

      <span class="fl">移動 <em>／ 行きと帰りをそれぞれ</em></span>
      <div id="e_segs"></div>
      <button type="button" class="add" id="e_addseg">＋ 移動を追加</button>

      <!-- 宿泊：出張期間が泊まり（開始日と最終日が別の日）のときだけ出す -->
      <div id="e_staybox" class="hide">
        <span class="fl">宿泊 <em>／ 泊まりの出張のときだけ</em></span>
        <div id="e_stays"></div>
        <button type="button" class="add" id="e_addstay">＋ 宿泊を追加</button>
      </div>
    </div>

    <!-- 出張報告 -->
    <div id="report" class="hide">
      <span class="fl">書き方</span>
      <div class="seg2" id="r_mode">
        <div class="on" data-v="day">日ごとに報告</div>
        <div data-v="all">まとめて報告</div>
      </div>

      <span class="fl">目的 <em>／ 空欄でも構いません</em></span>
      <input type="text" id="r_purpose" placeholder="未入力の場合は下の内容から作成します">

      <span class="fl" id="r_bodylabel">日ごとの出張内容</span>
      <div id="r_days"></div>
      <textarea id="r_all" class="hide" placeholder="〇〇社との打合せ、現場の立会い　など"></textarea>

      <span class="fl">決まったこと・成果</span>
      <textarea id="r_result" placeholder="単価改定は4月から／見積りは今月中に受領　など"></textarea>
    </div>

    <button type="button" class="submit" id="send">この内容で送る</button>
    <div class="hint">送信後、足りないところだけLINEでお伺いします。</div>
  </main>
</div>

<!-- カレンダー（開始日と終了日を1枚で決める） -->
<div class="sheet hide" id="cal">
  <div class="sheet-in">
    <div class="cal-h">
      <button type="button" id="cal_prev">‹</button>
      <b id="cal_title"></b>
      <button type="button" id="cal_next">›</button>
    </div>
    <div class="cal-w"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="cal-g" id="cal_g"></div>
    <div class="cal-sel" id="cal_sel"></div>
    <div class="cal-btns">
      <button type="button" id="cal_cancel">やめる</button>
      <button type="button" id="cal_ok">決定</button>
    </div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LIFF_ID = '2011518319-ABM6yIOM';
  // 受付先（Apps Script のウェブアプリ。LINEのWebhookと同じURL）
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxs0WXzhbnHdfmlzjYGmGBqtN4SPxKATK18uD8O4lhX9lL9FuJ3paP775mjoQwfwDJO/exec';

  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (p) {
    if (!p) return;
    var i = p.indexOf('=');
    q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' '));
  });
  var mode = (q.t === 'report') ? 'report' : 'expense';

  var MEANS = ['飛行機', '新幹線', '在来線', '車', 'バス'];
  var PAY    = ['個人', '法人', '支払なし'];   // 既定は個人（日帰り出張くんと同じ呼び方）
  var CLS = {   // 日帰り出張くんと同じ選択肢
    '飛行機': ['エコノミー', 'クラスJ', 'ビジネス', 'ファースト'],
    '新幹線': ['自由席', '指定席', 'グリーン', 'グランクラス']
  };
  var FROM_PH = { '飛行機': ['発（羽田）', '着（伊丹）'], '新幹線': ['発（東京）', '着（新大阪）'] };
  var MARU = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).trim(); };
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var maru = function (i) { return i < MARU.length ? MARU.charAt(i) : String(i + 1); };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };

  /* ---------- 使った場所を覚えておく（この端末の中だけ。サーバーには送らない） ----------
     places[手段] … 最近使った場所（新しい順・8件まで）／ lastFrom[手段] … 前回の行きの出発地 */
  var MEM_KEY = 'ai_form_places_v1';
  var mem = (function () {
    try { var o = JSON.parse(localStorage.getItem(MEM_KEY) || '{}') || {}; o.places = o.places || {}; o.lastFrom = o.lastFrom || {}; return o; }
    catch (e) { return { places: {}, lastFrom: {} }; }
  })();
  function remember() {
    each($('e_segs').children, function (w, i) {
      var m = segVal(w.querySelector('.s-mean'));
      if (!m) return;
      var fr = esc(w.querySelector('.s-from').value), to = esc(w.querySelector('.s-to').value);
      var list = mem.places[m] || [];
      [to, fr].forEach(function (x) {
        if (!x) return;
        list = [x].concat(list.filter(function (y) { return y !== x; }));
      });
      mem.places[m] = list.slice(0, 8);
      if (i === 0 && fr) mem.lastFrom[m] = fr;
    });
    try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch (e) {}
  }

  /* タップで1つ選ぶボタン */
  function segButtons(box, list, onPick) {
    box.innerHTML = '';
    list.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = t;
      b.setAttribute('data-v', t);
      b.onclick = function () {
        setSeg(box, t);
        box.classList.remove('auto');
        if (onPick) onPick(t);
      };
      box.appendChild(b);
    });
  }
  function setSeg(box, v) {
    each(box.children, function (x) { x.classList.toggle('on', x.getAttribute('data-v') === v); });
    box.classList.remove('bad');
  }
  function segVal(box) {
    var on = box.querySelector('.on');
    return on ? on.getAttribute('data-v') : '';
  }

  function opt(sel, list, ph) {
    sel.innerHTML = '';
    if (ph) sel.appendChild(new Option(ph, ''));
    list.forEach(function (t) { sel.appendChild(new Option(t, t)); });
  }
  function jp(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日' : '';
  }
  function md(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return '';
    var w = ['日','月','火','水','木','金','土'][new Date(m[1], m[2]-1, m[3]).getDay()];
    return Number(m[2]) + '月' + Number(m[3]) + '日（' + w + '）';
  }
  function days(from, to) {
    var out = [];
    if (!from) return out;
    var d = new Date(from), e = new Date(to || from);
    if (isNaN(d) || isNaN(e) || e < d) return [from];
    for (var i = 0; i < 62 && d <= e; i++) {
      out.push(d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  /* ============ カレンダー（期間を1枚で選ぶ） ============ */
  var cal = { field: null, kind: 'trip', from: '', to: '', cur: new Date() };

  function fieldText(el) {
    var f = el.getAttribute('data-from'), t = el.getAttribute('data-to');
    el.classList.toggle('empty', !f);
    if (!f) { el.textContent = el.getAttribute('data-ph') || '日付を選ぶ'; return; }
    if (!t || t === f) el.textContent = jp(f) + (el.getAttribute('data-kind') === 'trip' ? '（日帰り）' : '');
    else el.textContent = jp(f) + ' 〜 ' + jp(t);
  }

  function openCal(el) {
    cal.field = el;
    cal.kind  = el.getAttribute('data-kind') || 'trip';
    cal.from  = el.getAttribute('data-from') || '';
    cal.to    = el.getAttribute('data-to') || '';
    cal.cur   = cal.from ? new Date(cal.from) : new Date();
    cal.cur.setDate(1);
    drawCal();
    $('cal').classList.remove('hide');
  }

  function drawCal() {
    var y = cal.cur.getFullYear(), mo = cal.cur.getMonth();
    $('cal_title').textContent = y + '年' + (mo + 1) + '月';

    var head = new Date(y, mo, 1).getDay();
    var last = new Date(y, mo + 1, 0).getDate();
    var g = $('cal_g');
    g.innerHTML = '';

    for (var i = 0; i < head; i++) {
      var b = document.createElement('div');
      b.className = 'cd empty';
      g.appendChild(b);
    }
    for (var d = 1; d <= last; d++) {
      var iso = y + '-' + p2(mo + 1) + '-' + p2(d);
      var c = document.createElement('div');
      c.className = 'cd';
      c.textContent = d;
      c.setAttribute('data-iso', iso);
      if (cal.from && cal.to) {
        if (iso === cal.from) c.className = 'cd on s' + (cal.from === cal.to ? ' e' : '');
        else if (iso === cal.to) c.className = 'cd on e';
        else if (iso > cal.from && iso < cal.to) c.className = 'cd mid';
      } else if (iso === cal.from) {
        c.className = 'cd on s e';
      }
      c.onclick = pickDay;
      g.appendChild(c);
    }
    drawCalFoot();
  }

  function drawCalFoot() {
    var s = $('cal_sel');
    if (!cal.from) {
      s.innerHTML = '開始日を選んでください';
    } else if (!cal.to) {
      s.innerHTML = '<b>' + jp(cal.from) + '</b> 〜 ' +
        (cal.kind === 'trip' ? '最終日を選んでください（日帰りなら同じ日をもう一度）'
                             : 'チェックアウト日を選んでください');
    } else if (cal.from === cal.to) {
      s.innerHTML = '<b>' + jp(cal.from) + '</b>' + (cal.kind === 'trip' ? '（日帰り）' : '');
    } else {
      s.innerHTML = '<b>' + jp(cal.from) + ' 〜 ' + jp(cal.to) + '</b>';
    }
    $('cal_ok').disabled = !cal.from;
  }

  function pickDay() {
    var iso = this.getAttribute('data-iso');
    if (!cal.from || (cal.from && cal.to)) { cal.from = iso; cal.to = ''; }
    else if (iso < cal.from) { cal.from = iso; cal.to = ''; }
    else { cal.to = iso; }
    drawCal();
  }

  function setupCal() {
    $('cal_prev').onclick = function () { cal.cur.setMonth(cal.cur.getMonth() - 1); drawCal(); };
    $('cal_next').onclick = function () { cal.cur.setMonth(cal.cur.getMonth() + 1); drawCal(); };
    $('cal_cancel').onclick = function () { $('cal').classList.add('hide'); };
    $('cal').onclick = function (e) { if (e.target === $('cal')) $('cal').classList.add('hide'); };
    $('cal_ok').onclick = function () {
      if (!cal.from) return;
      cal.field.setAttribute('data-from', cal.from);
      cal.field.setAttribute('data-to', cal.to || cal.from);
      fieldText(cal.field);
      cal.field.classList.remove('auto');
      $('cal').classList.add('hide');
      if (cal.field.id === 'e_period') syncDates();
    };
  }

  function bindField(el, kind, ph) {
    el.setAttribute('data-kind', kind);
    el.setAttribute('data-ph', ph);
    el.onclick = function () { openCal(el); };
    fieldText(el);
  }

  function tripRange() {
    var el = $('e_period');
    var f = el.getAttribute('data-from') || '';
    return { from: f, to: el.getAttribute('data-to') || f };
  }

  /* ============ 旅費申請 ============ */
  function buildExpense() {
    $('title').textContent = '旅費申請';
    $('expense').classList.remove('hide');
    bindField($('e_period'), 'trip', '日付を選ぶ');
    addSeg(); addSeg();   // 宿泊の欄は、泊まりの期間を選んだときに出す
    $('e_addseg').onclick = function () { addSeg(); };
    $('e_addstay').onclick = function () { addStay(); };
  }

  function renumber(box, word) {
    Array.prototype.forEach.call(box.children, function (w, i) {
      w.querySelector('.card-h b').textContent = word + maru(i);
      w.setAttribute('data-idx', i);
      var rt = w.querySelector('.s-rt');
      if (rt) rt.classList.toggle('hide', i !== 0);   // 往復ボタンは移動①にだけ
    });
  }

  function addSeg() {
    var w = document.createElement('div');
    w.className = 'card';
    w.innerHTML =
      '<div class="card-h"><b></b><button type="button">削除</button></div>' +
      '<div class="segb s-mean"></div>' +
      '<button type="button" class="dfield empty s-date"></button>' +
      '<div class="two"><input type="text" class="s-from" placeholder="発（羽田）">' +
      '<span>→</span><input type="text" class="s-to" placeholder="着（伊丹）"></div>' +
      '<div class="s-chips hide"><span class="chips-l">最近使った場所（タップで入力）</span><div class="chips"></div></div>' +
      '<input type="text" class="s-name hide" placeholder="例：JAL〇〇便">' +
      '<span class="mini s-clsl hide">座席クラス</span>' +
      '<div class="segb s-cls hide"></div>' +
      '<span class="mini">支払</span>' +
      '<div class="segb s-pay"></div>' +
      '<button type="button" class="rt s-rt hide">⇄ 往復にする（帰りを自動入力）</button>';

    var mean = w.querySelector('.s-mean'), name = w.querySelector('.s-name');
    var cls = w.querySelector('.s-cls'), pay = w.querySelector('.s-pay');
    var fr = w.querySelector('.s-from'), to = w.querySelector('.s-to');
    segButtons(pay, PAY);
    setSeg(pay, '個人');
    bindField(w.querySelector('.s-date'), 'one', '利用日');

    segButtons(mean, MEANS, function (m) {
      refreshSeg(w);
      var segs = $('e_segs').children;
      // 行き（移動①）の出発地が空なら、前回の出発地を入れておく
      if (w === segs[0] && !esc(fr.value) && mem.lastFrom[m]) { fr.value = mem.lastFrom[m]; fr.classList.add('auto'); }
      // 1本目の手段を選んだら、まだ選んでいない2本目にも同じ手段を入れておく
      if (w === segs[0] && segs[1] && !segVal(segs[1].querySelector('.s-mean'))) {
        setSeg(segs[1].querySelector('.s-mean'), m);
        refreshSeg(segs[1]);
      }
    });
    fr.onfocus = function () { w._last = 'from'; };
    to.onfocus = function () { w._last = 'to'; };
    w.querySelector('.s-rt').onclick = function () { roundTrip(w); };

    w.querySelector('.card-h button').onclick = function () {
      w.remove();
      renumber($('e_segs'), '移動');
    };
    $('e_segs').appendChild(w);
    renumber($('e_segs'), '移動');
    syncDates();
    return w;
  }

  /* 手段に合わせて、便名・座席クラスの出し分けと、例・場所ボタンを入れ替える */
  function refreshSeg(w) {
    var m = segVal(w.querySelector('.s-mean')), list = CLS[m];
    var name = w.querySelector('.s-name'), cls = w.querySelector('.s-cls');
    name.classList.toggle('hide', !list);
    cls.classList.toggle('hide', !list);
    w.querySelector('.s-clsl').classList.toggle('hide', !list);
    if (list) {
      var cur = segVal(cls);
      segButtons(cls, list);
      setSeg(cls, cur);
      name.placeholder = (m === '新幹線') ? '例：のぞみ〇〇号' : '例：JAL〇〇便';   // 日帰り出張くんと同じ例
    } else {
      name.value = '';
      cls.innerHTML = '';
    }
    var ph = FROM_PH[m] || ['発', '着'];
    w.querySelector('.s-from').placeholder = ph[0];
    w.querySelector('.s-to').placeholder = ph[1];
    drawChips(w, m);
  }

  /* 最近使った場所のボタン。発が空なら発へ、発が入っていれば着へ入れる */
  function drawChips(w, m) {
    var box = w.querySelector('.s-chips'), list = (mem.places[m] || []).slice(0, 6);
    box.classList.toggle('hide', !list.length);
    var g = box.querySelector('.chips');
    g.innerHTML = '';
    list.forEach(function (nm) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = nm;
      b.onclick = function () {
        var fr = w.querySelector('.s-from'), to = w.querySelector('.s-to'), el;
        if (!esc(fr.value)) el = fr;
        else if (!esc(to.value)) el = to;
        else el = (w._last === 'from') ? fr : to;
        el.value = nm;
        el.classList.remove('bad', 'auto');
      };
      g.appendChild(b);
    });
  }

  /* 往復：移動①を逆向きにして移動②へ入れる（手段・座席クラス・支払も同じ。利用日は出張の最終日） */
  function roundTrip(w) {
    var btn = w.querySelector('.s-rt'), label = '⇄ 往復にする（帰りを自動入力）';
    var fr = w.querySelector('.s-from'), to = w.querySelector('.s-to'), m = segVal(w.querySelector('.s-mean'));
    if (!m || !esc(fr.value) || !esc(to.value)) {
      if (!m) w.querySelector('.s-mean').classList.add('bad');
      if (!esc(fr.value)) fr.classList.add('bad');
      if (!esc(to.value)) to.classList.add('bad');
      btn.textContent = '先に移動①の手段と発着を入れてください';
      setTimeout(function () { btn.textContent = label; }, 2200);
      return;
    }
    var back = $('e_segs').children[1] || addSeg();
    setSeg(back.querySelector('.s-mean'), m);
    refreshSeg(back);
    back.querySelector('.s-mean').classList.add('auto');

    var day = tripRange().to || w.querySelector('.s-date').getAttribute('data-from');
    if (day) {
      var bd = back.querySelector('.s-date');
      bd.setAttribute('data-from', day);
      bd.setAttribute('data-to', day);
      fieldText(bd);
      bd.classList.add('auto');
    }
    var c = segVal(w.querySelector('.s-cls'));
    if (c) { setSeg(back.querySelector('.s-cls'), c); back.querySelector('.s-cls').classList.add('auto'); }
    setSeg(back.querySelector('.s-pay'), segVal(w.querySelector('.s-pay')));

    var bf = back.querySelector('.s-from'), bt = back.querySelector('.s-to');
    bf.value = esc(to.value); bt.value = esc(fr.value);
    bf.classList.add('auto'); bt.classList.add('auto');
    bf.classList.remove('bad'); bt.classList.remove('bad');

    btn.textContent = '✓ 帰りに入れました';
    setTimeout(function () { btn.textContent = label; }, 2500);
    back.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  function addStay() {
    var w = document.createElement('div');
    w.className = 'card';
    w.innerHTML =
      '<div class="card-h"><b></b><button type="button">削除</button></div>' +
      '<input type="text" class="h-name" placeholder="ホテル名（ヒルトン大阪）">' +
      '<button type="button" class="dfield empty h-period"></button>' +
      '<span class="mini">支払</span>' +
      '<div class="segb h-pay"></div>';
    var pay = w.querySelector('.h-pay');
    segButtons(pay, PAY);
    setSeg(pay, '個人');
    bindField(w.querySelector('.h-period'), 'stay', '宿泊期間を選ぶ');
    w.querySelector('.card-h button').onclick = function () {
      w.remove();
      renumber($('e_stays'), '宿泊');
    };
    $('e_stays').appendChild(w);
    renumber($('e_stays'), '宿泊');
    syncDates();
  }

  /* 出張期間を決めたら、空いているところに初期値を入れる。手で直せる */
  function syncDates() {
    var r = tripRange();
    if (!r.from) return;

    // 日帰りなら宿泊の欄は出さない。泊まりなら出して、1件目を用意する
    var overnight = r.to !== r.from;
    $('e_staybox').classList.toggle('hide', !overnight);
    if (overnight && !$('e_stays').children.length) { addStay(); return; }   // addStay の中でもう一度ここに来る

    var segs = $('e_segs').children;
    Array.prototype.forEach.call(segs, function (w, i) {
      var d = w.querySelector('.s-date');
      if (d.getAttribute('data-from')) return;
      var iso = (i === 0) ? r.from : (i === 1 ? r.to : '');
      if (!iso) return;
      d.setAttribute('data-from', iso);
      d.setAttribute('data-to', iso);
      fieldText(d);
    });

    Array.prototype.forEach.call($('e_stays').children, function (w) {
      var d = w.querySelector('.h-period');
      if (d.getAttribute('data-from')) return;
      d.setAttribute('data-from', r.from);
      d.setAttribute('data-to', r.to);
      fieldText(d);
    });
  }

  function expenseText() {
    var r = tripRange();
    if (!r.from) return { err: '出張期間を選んでください。' };
    var place = esc($('e_place').value);
    if (!place) return { err: '出張先をご記入ください。' };

    var L = ['【旅費申請】'];
    L.push('出張期間：' + (r.to === r.from ? jp(r.from) + '（日帰り）' : jp(r.from) + '〜' + jp(r.to)));
    L.push('出張先：' + place);

    var segs = [];
    Array.prototype.forEach.call($('e_segs').children, function (w) {
      var m = segVal(w.querySelector('.s-mean'));
      var a = esc(w.querySelector('.s-from').value);
      var b = esc(w.querySelector('.s-to').value);
      var dv = w.querySelector('.s-date').getAttribute('data-from') || '';
      if (!m && !a && !b) return;
      var t = (dv ? jp(dv) + ' ' : '') + (m || '移動') + ' ' + (a || '？') + '→' + (b || '？');
      var nm = esc(w.querySelector('.s-name').value);
      var cl = segVal(w.querySelector('.s-cls'));
      if (nm) t += ' ' + nm;
      if (cl) t += '（' + cl + '）';
      var pv = segVal(w.querySelector('.s-pay'));
      if (pv) t += ' ／ ' + pv;
      segs.push(t);
    });
    if (!segs.length) return { err: '移動を1つ以上ご記入ください。' };
    L.push('移動：');
    segs.forEach(function (s) { L.push('・' + s); });

    var stays = [];
    var stayShown = !$('e_staybox').classList.contains('hide');
    Array.prototype.forEach.call(stayShown ? $('e_stays').children : [], function (w) {
      var nm = esc(w.querySelector('.h-name').value);
      if (!nm) return;
      var d = w.querySelector('.h-period');
      var f = d.getAttribute('data-from') || '', t2 = d.getAttribute('data-to') || '';
      var s = nm;
      if (f) s += '（' + jp(f) + (t2 && t2 !== f ? '〜' + jp(t2) : '') + '）';
      var pv = segVal(w.querySelector('.h-pay'));
      if (pv) s += ' ／ ' + pv;
      stays.push(s);
    });
    if (stays.length) { L.push('宿泊先：'); stays.forEach(function (s) { L.push('・' + s); }); }
    else L.push('宿泊先：なし' + (r.to === r.from ? '（日帰り）' : ''));

    return { text: L.join('\n') };
  }

  /* ============ 出張報告 ============ */
  var rMode = 'day';

  function buildReport() {
    $('title').textContent = '出張報告';

    var from = q.from || '', to = q.to || from, place = q.place || '';
    if (from || place) {
      $('ctx').classList.remove('hide');
      $('ctxv').textContent =
        (from ? jp(from) + (to && to !== from ? '〜' + jp(to) : '') : '') +
        (place ? '　' + place : '');
    }

    var list = days(from, to);
    if (!list.length) list = [''];
    list.forEach(function (d, i) {
      var box = document.createElement('div');
      box.className = 'day';
      box.innerHTML = '<div class="day-h">' + (d ? md(d) : ('その日にされたこと ' + (i + 1))) + '</div>' +
                      '<textarea placeholder="〇〇社との打合せ、現場の立会い　など"></textarea>';
      box.setAttribute('data-d', d ? md(d) : '');
      $('r_days').appendChild(box);
    });

    Array.prototype.forEach.call($('r_mode').children, function (b) {
      b.onclick = function () {
        Array.prototype.forEach.call($('r_mode').children, function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        rMode = b.getAttribute('data-v');
        var day = (rMode === 'day');
        $('r_days').classList.toggle('hide', !day);
        $('r_all').classList.toggle('hide', day);
        $('r_bodylabel').textContent = day ? '日ごとの出張内容' : '出張内容';
      };
    });

    $('report').classList.remove('hide');
  }

  function reportText() {
    var L = ['【出張報告】'];
    var pur = esc($('r_purpose').value);
    if (pur) L.push('目的：' + pur);

    var body = [];
    if (rMode === 'day') {
      Array.prototype.forEach.call($('r_days').children, function (box) {
        var t = esc(box.querySelector('textarea').value);
        if (!t) return;
        var d = box.getAttribute('data-d');
        body.push(d ? '【' + d + '】\n' + t : t);
      });
    } else {
      var a = esc($('r_all').value);
      if (a) body.push(a);
    }
    if (!body.length) return { err: '出張内容をご記入ください。' };
    L.push('出張内容：');
    L.push(body.join('\n'));

    var r = esc($('r_result').value);
    if (r) L.push('成果：' + r);

    return { text: L.join('\n') };
  }

  function show(t) { var m = $('msg'); m.textContent = t; m.classList.remove('hide'); }

  /* ============ 起動 ============ */
  var PREVIEW = /[?&]preview=1/.test(location.search);   // PCでの見た目確認用（送信しない）
  (PREVIEW ? Promise.resolve() : liff.init({ liffId: LIFF_ID })).then(function () {
    if (!PREVIEW && !liff.isInClient()) { show('このページはLINEアプリの中で開いてください。'); return; }
    setupCal();
    if (mode === 'report') buildReport(); else buildExpense();
    $('form').classList.remove('hide');

    function failed(e) {
      $('send').disabled = false;
      $('send').textContent = 'この内容で送る';
      show('送信できませんでした。もう一度お試しください。（' + e + '）');
    }
    /* 従来の送り方：トークに申請文を送る */
    function viaTalk(text) {
      liff.sendMessages([{ type: 'text', text: text }])
        .then(function () { liff.closeWindow(); })
        .catch(failed);
    }

    // 直し始めたら、自動入力の色と赤枠を消す
    document.addEventListener('input', function (e) { if (e.target.classList) e.target.classList.remove('bad', 'auto'); });

    $('send').onclick = function () {
      var r = (mode === 'report') ? reportText() : expenseText();
      if (r.err) { alert(r.err); return; }
      if (mode !== 'report') remember();   // 次回のために、使った場所をこの端末に覚えておく
      if (PREVIEW) { console.log(r.text); show('プレビューのため送信していません。'); return; }
      $('send').disabled = true;
      $('send').textContent = '送信中…（少しお待ちください）';
      /* 通常：受付先へ直接送る。トークに申請文は出さず、AIの返事だけが届く（日帰り出張くんと同じ） */
      var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);   // 二重送信よけの目印
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'ai_form', id: id, accessToken: liff.getAccessToken(), text: r.text })
      })
        .then(function (res) { return res.json(); })
        .then(function (j) {
          if (j.ok) { liff.closeWindow(); return; }
          if (j.fallback) { viaTalk(r.text); return; }   // 送信数の上限が近いときなど
          failed(j.error || 'error');
        })
        .catch(function () { viaTalk(r.text); });   // 受付先につながらないとき
    };
  }).catch(function (e) { show('起動に失敗しました。（' + e + '）'); });
})();
</script>
</body>
</html>
