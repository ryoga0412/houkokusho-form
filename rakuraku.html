<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>らくらく申請くん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{--brand:#0E6B4C;--brand-lt:#E4F1EA;--ink:#1B2320;--dim:#8A9790;
        --line:#E4E9E5;--bg:#F7F8F6;--white:#fff;--warn:#B26B5E}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
  .wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
  header{background:var(--white);border-bottom:1px solid var(--line);padding:14px 18px}
  header h1{font-size:17px;font-weight:700}
  header p{font-size:12px;color:var(--dim)}
  main{padding:14px 16px}
  .msg{margin:18px;padding:14px;border-radius:10px;background:#FBEDE9;color:#8C4A3C;font-size:13.5px}
  .hide{display:none !important}

  /* 1行＝1件の出張 */
  .row{background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .row-h{display:flex;justify-content:space-between;align-items:center;
         background:#F2F7F4;border-bottom:1px solid var(--line);padding:9px 14px}
  .row-h b{font-size:14px;color:var(--brand)}
  .row-h button{background:none;border:none;color:var(--warn);font-size:12.5px;font-family:inherit;cursor:pointer;padding:2px 4px}
  .row-b{padding:4px 14px 14px}
  .fl{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:12px 0 6px;letter-spacing:.03em}
  .fl em{font-style:normal;font-weight:500;color:#AEB8B1}

  input[type=text],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:15px;
    font-family:inherit;color:var(--ink);background:var(--white);line-height:1.6;
    -webkit-appearance:none;appearance:none}
  textarea{min-height:76px;resize:vertical}
  input::placeholder,textarea::placeholder{color:#AEB8B1}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:-2px}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
    linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  select.empty{color:#AEB8B1}

  .dates>*+*{margin-top:7px}
  .dline{display:flex;gap:6px;align-items:center}
  .dfield{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:11px 12px;
          font-size:15px;font-family:inherit;color:var(--ink);background:var(--white);
          text-align:left;line-height:1.6;cursor:pointer}
  .dfield.empty{color:#AEB8B1}
  .dline .x{flex:none;width:38px;height:46px;border:none;background:none;color:var(--warn);font-size:20px;cursor:pointer}
  .another{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
  .another span{font-size:12.5px;color:#56655C}
  .adddate{border:1px solid #BFD8CB;background:var(--white);color:var(--brand);font-size:13px;font-weight:700;
           font-family:inherit;padding:6px 12px;border-radius:16px;cursor:pointer}

  .more{background:#F7FAF8;border:1px solid var(--line);border-radius:10px;padding:2px 11px 11px;margin-top:9px}
  .more .fl{margin-top:9px}
  .two{display:flex;gap:7px;align-items:center}
  .two>*{flex:1;min-width:0}
  .two span{flex:none;color:var(--dim);font-size:13px}

  .addrow{border:1.5px dashed #BFD8CB;color:var(--brand);border-radius:11px;padding:13px;
          text-align:center;font-size:14px;font-weight:700;background:var(--white);width:100%;
          font-family:inherit;cursor:pointer}
  .submit{width:100%;background:var(--brand);color:#fff;border:none;border-radius:11px;
          padding:15px;font-size:16px;font-weight:700;font-family:inherit;margin-top:18px;cursor:pointer}
  .submit:disabled{background:#A9BFB4}
  .ghost{width:100%;background:#EEF1EF;color:#56655C;border:none;border-radius:11px;padding:13px;
         font-size:15px;font-weight:700;font-family:inherit;margin-top:9px;cursor:pointer}
  .hint{font-size:11.5px;color:var(--dim);margin-top:9px;text-align:center}
  .err{color:var(--warn);font-size:13px;margin-top:12px;text-align:center;min-height:1em}
  .bad{outline:2px solid var(--warn) !important;outline-offset:-2px}

  .preview{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;
           white-space:pre-wrap;font-size:14px;line-height:1.8}

  /* カレンダー */
  .sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:50;
         display:flex;align-items:flex-end;justify-content:center}
  .sheet-in{background:var(--white);width:100%;max-width:560px;
            border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-h b{font-size:15px}
  .cal-h button{border:none;background:var(--brand-lt);color:var(--brand);width:38px;height:38px;
                border-radius:19px;font-size:20px;line-height:1;font-family:inherit;cursor:pointer}
  .cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-w span{text-align:center;font-size:11px;color:var(--dim);padding-bottom:4px}
  .cal-w span:first-child{color:#C4726A}
  .cal-w span:last-child{color:#6A86C4}
  .cd{height:42px;display:flex;align-items:center;justify-content:center;font-size:14.5px;cursor:pointer;border-radius:21px}
  .cd.empty{cursor:default}
  .cd.mid{background:var(--brand-lt);border-radius:0}
  .cd.on{background:var(--brand);color:#fff;font-weight:700}
  .cd.on.s{border-radius:21px 0 0 21px}
  .cd.on.e{border-radius:0 21px 21px 0}
  .cd.on.s.e{border-radius:21px}
  .cal-sel{text-align:center;font-size:13px;color:var(--dim);margin:12px 0 10px;min-height:22px}
  .cal-sel b{color:var(--ink);font-size:14.5px}
  .cal-btns{display:flex;gap:9px}
  .cal-btns button{flex:1;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  #cal_cancel{background:#EEF1EF;color:#56655C}
  #cal_ok{background:var(--brand);color:#fff}
  #cal_ok:disabled{background:#A9BFB4}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>らくらく申請くん</h1>
    <p>出張ごとに1件ずつ。行はいくつでも増やせます</p>
  </header>
  <div class="msg hide" id="msg"></div>

  <!-- 入力画面 -->
  <main class="hide" id="form">
    <div id="rows"></div>
    <button type="button" class="addrow" id="addrow">＋ 出張を追加</button>
    <div class="err" id="err"></div>
    <button type="button" class="submit" id="next">確認へ進む</button>
  </main>

  <!-- 確認画面 -->
  <main class="hide" id="confirm">
    <span class="fl" style="margin-top:0">この内容でLINEに送ります</span>
    <div class="preview" id="preview"></div>
    <button type="button" class="submit" id="send">送信する</button>
    <button type="button" class="ghost" id="back">戻って直す</button>
    <div class="hint">送信すると、LINEで受付のお知らせが届きます。</div>
  </main>
</div>

<!-- 1行のひな形 -->
<template id="tpl_row">
  <div class="row">
    <div class="row-h"><b class="r-no"></b><button type="button" class="r-del">この出張を削除</button></div>
    <div class="row-b">
      <span class="fl">出張開始・終了日 <em>／ 日帰りは同じ日を2回</em></span>
      <div class="dates r-dates"></div>
      <div class="another">
        <span>別の日に同じ内容の出張がありましたか？</span>
        <button type="button" class="adddate r-adddate">＋日付の追加</button>
      </div>

      <span class="fl">出張先</span>
      <input type="text" class="r-place" placeholder="大阪府 大阪市／アメリカ ラスベガス">

      <div class="r-staybox hide">
        <span class="fl">宿泊先 <em>／ 泊まりの出張のときだけ</em></span>
        <input type="text" class="r-stay" placeholder="ホテル名（ヒルトン大阪）">
      </div>

      <span class="fl">移動手段</span>
      <select class="r-mean empty">
        <option value="">選んでください</option>
        <option>飛行機</option>
        <option>新幹線</option>
        <option>在来線</option>
        <option>車</option>
      </select>
      <div class="more r-more hide">
        <span class="fl">座席クラス</span>
        <select class="r-cls empty"></select>
        <span class="fl">発着</span>
        <div class="two">
          <input type="text" class="r-from" placeholder="発（羽田）">
          <span>→</span>
          <input type="text" class="r-to" placeholder="着（伊丹）">
        </div>
      </div>

      <span class="fl">仕事内容</span>
      <textarea class="r-work" placeholder="〇〇社との打合せ、現場の立会い　など"></textarea>
    </div>
  </div>
</template>

<!-- カレンダー（開始日と終了日を1枚で決める） -->
<div class="sheet hide" id="cal">
  <div class="sheet-in">
    <div class="cal-h">
      <button type="button" id="cal_prev">‹</button>
      <b id="cal_title"></b>
      <button type="button" id="cal_next">›</button>
    </div>
    <div class="cal-w"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="cal-g" id="cal_g"></div>
    <div class="cal-sel" id="cal_sel"></div>
    <div class="cal-btns">
      <button type="button" id="cal_cancel">やめる</button>
      <button type="button" id="cal_ok">決定</button>
    </div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LIFF_ID = '2011518319-ABM6yIOM';
  var HEADER  = '【旅費申請】';          // Code.gs が受け取る見出し（既存フォームと同じ）
  var MARK    = '（らくらく申請くんから送信）';   // Code.gs の isRakurakuText() が見る目印
  var PREVIEW = /[?&]preview=1/.test(location.search);  // PCでの見た目確認用（送信しない）

  var CLS = {
    '飛行機': ['エコノミー', 'クラスJ（JAL）', 'ビジネス', 'ファースト'],
    '新幹線': ['自由席', '指定席', 'グリーン', 'グランクラス']
  };

  var $ = function (id) { return document.getElementById(id); };
  var val = function (s) { return String(s == null ? '' : s).trim(); };
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };

  function jp(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日' : '';
  }
  function wd(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? '（' + '日月火水木金土'.charAt(new Date(+m[1], m[2] - 1, +m[3]).getDay()) + '）' : '';
  }
  function rangeText(f, t) {
    if (!f) return '';
    if (!t || t === f) return jp(f) + wd(f) + '（日帰り）';
    var tt = (f.slice(0, 4) === t.slice(0, 4)) ? jp(t).replace(/^\d{4}年/, '') : jp(t);   // 同じ年なら終了日の年は省く
    return jp(f) + wd(f) + '〜' + tt + wd(t);
  }

  /* ---------- カレンダー ---------- */
  var cal = { field: null, from: '', to: '', cur: new Date() };

  function fieldText(el) {
    var f = el.getAttribute('data-from'), t = el.getAttribute('data-to');
    el.classList.toggle('empty', !f);
    el.textContent = f ? rangeText(f, t) : '日付を選ぶ';
  }
  function openCal(el) {
    cal.field = el;
    cal.from = el.getAttribute('data-from') || '';
    cal.to = el.getAttribute('data-to') || '';
    cal.cur = cal.from ? new Date(cal.from + 'T00:00:00') : new Date();
    cal.cur.setDate(1);
    drawCal();
    $('cal').classList.remove('hide');
  }
  function drawCal() {
    var y = cal.cur.getFullYear(), mo = cal.cur.getMonth();
    $('cal_title').textContent = y + '年' + (mo + 1) + '月';
    var head = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
    var g = $('cal_g'); g.innerHTML = '';
    for (var i = 0; i < head; i++) { var b = document.createElement('div'); b.className = 'cd empty'; g.appendChild(b); }
    for (var d = 1; d <= last; d++) {
      var iso = y + '-' + p2(mo + 1) + '-' + p2(d);
      var c = document.createElement('div');
      c.className = 'cd'; c.textContent = d; c.setAttribute('data-iso', iso);
      if (cal.from && cal.to) {
        if (iso === cal.from) c.className = 'cd on s' + (cal.from === cal.to ? ' e' : '');
        else if (iso === cal.to) c.className = 'cd on e';
        else if (iso > cal.from && iso < cal.to) c.className = 'cd mid';
      } else if (iso === cal.from) c.className = 'cd on s e';
      c.onclick = pickDay;
      g.appendChild(c);
    }
    var s = $('cal_sel');
    if (!cal.from) s.innerHTML = '開始日を選んでください';
    else if (!cal.to) s.innerHTML = '<b>' + jp(cal.from) + '</b> 〜 終了日を選んでください（日帰りは同じ日をもう一度）';
    else s.innerHTML = '<b>' + rangeText(cal.from, cal.to) + '</b>';
    $('cal_ok').disabled = !cal.from;
  }
  function pickDay() {
    var iso = this.getAttribute('data-iso');
    if (!cal.from || cal.to || iso < cal.from) { cal.from = iso; cal.to = ''; }
    else cal.to = iso;
    drawCal();
  }
  function setupCal() {
    $('cal_prev').onclick = function () { cal.cur.setMonth(cal.cur.getMonth() - 1); drawCal(); };
    $('cal_next').onclick = function () { cal.cur.setMonth(cal.cur.getMonth() + 1); drawCal(); };
    $('cal_cancel').onclick = function () { $('cal').classList.add('hide'); };
    $('cal').onclick = function (e) { if (e.target === $('cal')) $('cal').classList.add('hide'); };
    $('cal_ok').onclick = function () {
      if (!cal.from) return;
      cal.field.setAttribute('data-from', cal.from);
      cal.field.setAttribute('data-to', cal.to || cal.from);   // 終了日を選ばずに決定したら日帰り
      cal.field.classList.remove('bad');
      fieldText(cal.field);
      $('cal').classList.add('hide');
      syncStay(cal.field.closest('.row'));
    };
  }

  /* ---------- 行 ---------- */
  function addDate(row, removable) {
    var line = document.createElement('div');
    line.className = 'dline';
    line.innerHTML = '<button type="button" class="dfield empty"></button>' +
                     (removable ? '<button type="button" class="x" aria-label="この日を削除">×</button>' : '');
    var f = line.querySelector('.dfield');
    f.onclick = function () { openCal(f); };
    fieldText(f);
    if (removable) line.querySelector('.x').onclick = function () { line.remove(); syncStay(row); };
    row.querySelector('.r-dates').appendChild(line);
    return f;
  }

  /* 開始日と終了日が別の日（泊まり）が1つでもあれば、宿泊先の欄を出す */
  function syncStay(row) {
    if (!row) return;
    var overnight = false;
    each(row.querySelectorAll('.dfield'), function (f) {
      var a = f.getAttribute('data-from'), b = f.getAttribute('data-to');
      if (a && b && a !== b) overnight = true;
    });
    row.querySelector('.r-staybox').classList.toggle('hide', !overnight);
  }

  function renumber() {
    var rows = $('rows').children;
    each(rows, function (r, i) {
      r.querySelector('.r-no').textContent = '出張' + (i < 20 ? String.fromCharCode(0x2460 + i) : (i + 1));   // ①②③…
      r.querySelector('.r-del').classList.toggle('hide', rows.length === 1);
    });
  }

  function addRow() {
    var row = $('tpl_row').content.firstElementChild.cloneNode(true);
    var mean = row.querySelector('.r-mean'), cls = row.querySelector('.r-cls'), more = row.querySelector('.r-more');

    addDate(row, false);
    row.querySelector('.r-adddate').onclick = function () { openCal(addDate(row, true)); };

    mean.onchange = function () {
      var m = mean.value, list = CLS[m];
      mean.classList.toggle('empty', !m);
      mean.classList.remove('bad');
      more.classList.toggle('hide', !list);   // 飛行機・新幹線のときだけ出す
      if (!list) return;
      var cur = cls.value;
      cls.innerHTML = '<option value="">選んでください</option>';
      list.forEach(function (t) { cls.appendChild(new Option(t, t.replace('（JAL）', ''))); });
      cls.value = cur;   // 選び直す前のクラスが新しい一覧にあれば残す
      if (cls.selectedIndex < 0) cls.value = '';
      cls.classList.toggle('empty', !cls.value);
    };
    cls.onchange = function () { cls.classList.toggle('empty', !cls.value); cls.classList.remove('bad'); };
    each(row.querySelectorAll('input,textarea'), function (el) {
      el.addEventListener('input', function () { el.classList.remove('bad'); });
    });

    row.querySelector('.r-del').onclick = function () { row.remove(); renumber(); };
    $('rows').appendChild(row);
    renumber();
    return row;
  }

  /* ---------- 送る文章をつくる ---------- */
  function build() {
    each(document.querySelectorAll('.bad'), function (x) { x.classList.remove('bad'); });
    var rows = $('rows').children, L = [HEADER], first = null;

    function bad(el, msg) { el.classList.add('bad'); if (!first) first = { el: el, msg: msg }; }

    each(rows, function (row, i) {
      var no = row.querySelector('.r-no').textContent;
      var dates = [];
      each(row.querySelectorAll('.dfield'), function (f) {
        var a = f.getAttribute('data-from');
        if (a) dates.push(rangeText(a, f.getAttribute('data-to')));
        else bad(f, no + 'の日付を選んでください。');
      });
      var place = row.querySelector('.r-place'), mean = row.querySelector('.r-mean');
      var work = row.querySelector('.r-work');
      if (!val(place.value)) bad(place, no + 'の出張先をご記入ください。');
      if (!mean.value) bad(mean, no + 'の移動手段を選んでください。');
      var stayBox = row.querySelector('.r-staybox'), stay = row.querySelector('.r-stay');
      var needStay = !stayBox.classList.contains('hide');
      if (needStay && !val(stay.value)) bad(stay, no + 'の宿泊先をご記入ください。');

      var meanTxt = mean.value;
      if (CLS[mean.value]) {
        var cls = row.querySelector('.r-cls'), fr = row.querySelector('.r-from'), to = row.querySelector('.r-to');
        if (!cls.value) bad(cls, no + 'の座席クラスを選んでください。');
        if (!val(fr.value)) bad(fr, no + 'の出発地をご記入ください。');
        if (!val(to.value)) bad(to, no + 'の到着地をご記入ください。');
        meanTxt += '（' + val(fr.value) + '→' + val(to.value) + '／' + cls.value + '）';
      }
      if (!val(work.value)) bad(work, no + 'の仕事内容をご記入ください。');

      if (rows.length > 1) L.push((i ? '\n' : '') + '■' + no);
      if (dates.length === 1) L.push('出張期間：' + dates[0]);
      else { L.push('出張期間：（同じ内容で' + dates.length + '回）'); dates.forEach(function (d) { L.push('・' + d); }); }
      L.push('出張先：' + val(place.value));
      if (needStay) L.push('宿泊先：' + val(stay.value));
      L.push('移動手段：' + meanTxt);
      L.push('仕事内容：' + val(work.value));
    });

    if (first) {
      first.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return { err: first.msg };
    }
    L.push(MARK);
    return { text: L.join('\n') };
  }

  function show(t) { var m = $('msg'); m.textContent = t; m.classList.remove('hide'); }

  /* ---------- 起動 ---------- */
  function start() {
    setupCal();
    addRow();
    // 直し始めたら、前のエラー表示は消す
    document.addEventListener('input', function () { $('err').textContent = ''; });
    document.addEventListener('change', function () { $('err').textContent = ''; });
    $('addrow').onclick = function () {
      var r = addRow();
      r.scrollIntoView({ block: 'start', behavior: 'smooth' });
    };

    var draft = '';
    $('next').onclick = function () {
      var r = build();
      $('err').textContent = r.err || '';
      if (r.err) return;
      draft = r.text;
      $('preview').textContent = draft;
      $('form').classList.add('hide');
      $('confirm').classList.remove('hide');
      window.scrollTo(0, 0);
    };
    $('back').onclick = function () {
      $('confirm').classList.add('hide');
      $('form').classList.remove('hide');
    };
    $('send').onclick = function () {
      if (PREVIEW) { console.log(draft); show('プレビューのため送信していません。'); return; }
      if (draft.length > 5000) { show('内容が長すぎて送れません（LINEの上限5000字）。出張を分けて送ってください。'); return; }
      $('send').disabled = true;
      $('send').textContent = '送信中…';
      liff.sendMessages([{ type: 'text', text: draft }])
        .then(function () { liff.closeWindow(); })
        .catch(function (e) {
          $('send').disabled = false;
          $('send').textContent = '送信する';
          show('送信できませんでした。もう一度お試しください。（' + e + '）');
        });
    };
    $('form').classList.remove('hide');
  }

  if (PREVIEW) { start(); return; }
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isInClient()) { show('このページはLINEアプリの中で開いてください。'); return; }
    start();
  }).catch(function (e) { show('起動に失敗しました。（' + e + '）'); });
})();
</script>
</body>
</html>
