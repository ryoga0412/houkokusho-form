<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日帰り出張一括報告</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{--brand:#0E6B4C;--brand-lt:#E4F1EA;--ink:#1B2320;--dim:#8A9790;
        --line:#E4E9E5;--bg:#F7F8F6;--white:#fff;--warn:#B26B5E}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
  .wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
  header{background:var(--white);border-bottom:1px solid var(--line);padding:14px 18px}
  header h1{font-size:17px;font-weight:700}
  main{padding:14px 16px}
  .msg{margin:18px;padding:14px;border-radius:10px;background:#FBEDE9;color:#8C4A3C;font-size:13.5px}
  .hide{display:none !important}

  /* 1枠＝1件の出張 */
  .row{background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .row-h{display:flex;justify-content:space-between;align-items:center;
         background:#F2F7F4;border-bottom:1px solid var(--line);padding:9px 14px}
  .row-h b{font-size:14px;color:var(--brand)}
  .row-h button{background:none;border:none;color:var(--warn);font-size:12.5px;font-family:inherit;cursor:pointer;padding:2px 4px}
  .row-b{padding:4px 14px 14px}
  .fl{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:12px 0 6px;letter-spacing:.03em}
  .fl em{font-style:normal;font-weight:500;color:#AEB8B1}

  input[type=text],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:15px;
    font-family:inherit;color:var(--ink);background:var(--white);line-height:1.6;
    -webkit-appearance:none;appearance:none}
  textarea{min-height:76px;resize:vertical}
  input::placeholder,textarea::placeholder{color:#AEB8B1}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:-2px}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
    linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  select.empty{color:#AEB8B1}

  .dfield{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:11px 12px;
          font-size:15px;font-family:inherit;color:var(--ink);background:var(--white);
          text-align:left;line-height:1.6;cursor:pointer;display:block}
  .dfield.empty{color:#AEB8B1}

  /* 明細（移動）の小さなカード */
  .sub{background:#F7FAF8;border:1px solid var(--line);border-radius:10px;padding:4px 11px 11px;margin-top:9px}
  .sub-h{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .sub-h b{font-size:12.5px;color:var(--brand)}
  .sub-h button{background:none;border:none;color:var(--warn);font-size:12px;font-family:inherit;cursor:pointer;padding:2px 4px}
  .sub .fl{margin-top:9px}
  .two{display:flex;gap:7px;align-items:center}
  .two>*{flex:1;min-width:0}
  .two span{flex:none;color:var(--dim);font-size:13px}
  /* 支払の区分（1つだけ選ぶボタン） */
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--white)}
  .seg button{flex:1;border:none;background:none;padding:10px 4px;font-size:14px;font-family:inherit;color:#56655C;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--brand);color:#fff;font-weight:700}
  /* 手段・座席クラス（タップで選ぶ） */
  .seg.pick button{padding:10px 2px;font-size:13.5px;white-space:nowrap}
  /* 自動で入った欄（さわると元の色に戻る） */
  .auto,.seg.auto{background:#FFF6D8 !important}
  /* 往復ボタン */
  .rt{width:100%;margin-top:14px;border:1.5px solid var(--brand);background:var(--white);color:var(--brand);
      border-radius:10px;padding:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  /* 最近使った場所 */
  .chips-l{display:block;font-size:11px;color:var(--dim);margin-top:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .chips button{border:none;background:var(--brand-lt);color:var(--brand);border-radius:14px;padding:5px 12px;
                font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}

  /* ＋◯◯を追加。枠は付けず、文字だけのボタンにする */
  .pill{border:none;background:none;color:var(--brand);font-size:13.5px;font-weight:700;
        font-family:inherit;padding:7px 2px;cursor:pointer;margin-top:6px}

  .addrow{border:1.5px dashed #BFD8CB;color:var(--brand);border-radius:11px;padding:13px;
          text-align:center;font-size:14px;font-weight:700;background:var(--white);width:100%;
          font-family:inherit;cursor:pointer}
  .submit{width:100%;background:var(--brand);color:#fff;border:none;border-radius:11px;
          padding:15px;font-size:16px;font-weight:700;font-family:inherit;margin-top:18px;cursor:pointer}
  .submit:disabled{background:#A9BFB4}
  .ghost{width:100%;background:#EEF1EF;color:#56655C;border:none;border-radius:11px;padding:13px;
         font-size:15px;font-weight:700;font-family:inherit;margin-top:9px;cursor:pointer}
  .hint{font-size:11.5px;color:var(--dim);margin-top:9px;text-align:center}
  .err{color:var(--warn);font-size:13px;margin-top:12px;text-align:center;min-height:1em}
  .bad{outline:2px solid var(--warn) !important;outline-offset:-2px}

  .preview{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;
           white-space:pre-wrap;font-size:14px;line-height:1.8}

  /* カレンダー */
  .sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:50;
         display:flex;align-items:flex-end;justify-content:center}
  .sheet-in{background:var(--white);width:100%;max-width:560px;
            border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-h b{font-size:15px}
  .cal-h button{border:none;background:var(--brand-lt);color:var(--brand);width:38px;height:38px;
                border-radius:19px;font-size:20px;line-height:1;font-family:inherit;cursor:pointer}
  .cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-w span{text-align:center;font-size:11px;color:var(--dim);padding-bottom:4px}
  .cal-w span:first-child{color:#C4726A}
  .cal-w span:last-child{color:#6A86C4}
  .cd{height:42px;display:flex;align-items:center;justify-content:center;font-size:14.5px;cursor:pointer;border-radius:21px;margin:1px 2px}
  .cd.empty{cursor:default}
  .cd.on{background:var(--brand);color:#fff;font-weight:700}
  .cal-sel{text-align:center;font-size:13px;color:var(--dim);margin:12px 0 10px;min-height:22px}
  .cal-sel b{color:var(--ink);font-size:14.5px}
  .cal-btns{display:flex;gap:9px}
  .cal-btns button{flex:1;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  #cal_cancel{background:#EEF1EF;color:#56655C}
  #cal_ok{background:var(--brand);color:#fff}
  #cal_ok:disabled{background:#A9BFB4}
  /* 支払は小さなボタンで横に並べる */
  .seg.pay{display:inline-flex;gap:6px;border:none;background:none;border-radius:0;overflow:visible;width:auto}
  .seg.pay button{flex:none;border:1px solid var(--line);background:var(--white);color:#56655C;
                  border-radius:15px;padding:5px 15px;font-size:13px;line-height:1.5}
  .seg.pay button+button{border-left:1px solid var(--line)}
  .seg.pay button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}

  /* 横に2つ並べる */
  .duo{display:flex;gap:9px}
  .duo>div{flex:1;min-width:0}

  /* 会社名・出張者（複数行） */
  .who{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  .who input{flex:1;min-width:0}
  .who .w-del{flex:none;border:none;background:none;color:var(--warn);font-size:18px;line-height:1;
              font-family:inherit;cursor:pointer;padding:4px 6px}

  /* 写真 */
  .ph-list{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
  .ph-chip{display:inline-flex;align-items:center;gap:9px;background:#F1F5F2;border-radius:11px;padding:8px 11px;font-size:13px;color:#2C3B33}
  .ph-chip img{width:36px;height:36px;object-fit:cover;border-radius:7px;display:block;background:#DDE5E0}
  .ph-chip .st{color:#6B7B72;font-size:12px}
  .ph-chip.ok .st{color:#0A7A45;font-weight:700}
  .ph-chip.ng .st{color:#C0392B;font-weight:700}
  .ph-chip .x{border:none;background:none;color:#8A9A90;font-size:17px;line-height:1;cursor:pointer;padding:0 1px;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>日帰り出張一括報告</h1>
  </header>
  <div class="msg hide" id="msg"></div>

  <!-- 入力画面 -->
  <main class="hide" id="form">
    <div id="rows"></div>
    <button type="button" class="addrow" id="addrow">＋ 出張を追加</button>
    <div class="err" id="err"></div>
    <button type="button" class="submit" id="next">確認へ進む</button>
  </main>

  <!-- 確認画面 -->
  <main class="hide" id="confirm">
    <span class="fl" style="margin-top:0">この内容でLINEに送ります</span>
    <div class="preview" id="preview"></div>
    <button type="button" class="submit" id="send">送信する</button>
    <button type="button" class="ghost" id="back">戻って直す</button>
    <div class="hint">送信すると、LINEで受付のお知らせが届きます。</div>
  </main>
</div>

<!-- 出張1件のひな形 -->
<template id="tpl_row">
  <div class="row">
    <div class="row-h"><b class="r-no"></b><button type="button" class="r-del">この出張を削除</button></div>
    <div class="row-b">
      <span class="fl">会社名</span>
      <div class="r-cos"></div>
      <button type="button" class="pill r-addco">＋ 会社を追加</button>

      <span class="fl">出張者</span>
      <div class="r-whos"></div>
      <button type="button" class="pill r-addwho">＋ 出張者を追加</button>

      <span class="fl">出張先</span>
      <input type="text" class="r-place" placeholder="品川／ゴルフ場名／現場名">

      <span class="fl">出張日</span>
      <button type="button" class="dfield empty r-dates"></button>

      <div class="r-billbox hide">
        <span class="fl">交通費の請求先</span>
        <select class="r-bill empty"></select>
      </div>

      <span class="fl">移動手段</span>
      <div class="r-legs"></div>
      <button type="button" class="pill r-addleg">＋ 移動を追加</button>

      <span class="fl">仕事内容</span>
      <textarea class="r-work" placeholder="〇〇社との打合せ、現場の立会い　など"></textarea>

      <span class="fl">写真</span>
      <div class="ph-list r-phlist"></div>
      <button type="button" class="pill r-addph">📎　写真を追加</button>
      <input type="file" class="r-file" accept="image/*" multiple hidden>
    </div>
  </div>
</template>

<!-- 会社1社ぶん -->
<template id="tpl_co">
  <div class="who">
    <input type="text" class="r-co" placeholder="会社名">
    <button type="button" class="w-del">×</button>
  </div>
</template>

<!-- 出張者1人ぶん -->
<template id="tpl_who">
  <div class="who">
    <input type="text" class="r-who" placeholder="氏名">
    <button type="button" class="w-del">×</button>
  </div>
</template>

<!-- 移動1区間。手段は区間ごとに選ぶ。飛行機・新幹線のときだけ明細を出す -->
<template id="tpl_leg">
  <div class="sub">
    <div class="sub-h"><b class="l-no"></b><button type="button" class="l-del">削除</button></div>
    <div class="duo">
      <div>
        <span class="fl">手段</span>
        <select class="l-mean empty">
          <option value="">選んでください</option>
          <option value="飛行機">飛行機</option>
          <option value="新幹線">新幹線</option>
          <option value="在来線">在来線</option>
          <option value="車">車</option>
        </select>
      </div>
      <div class="l-day hide">
        <span class="fl">利用日</span>
        <button type="button" class="dfield empty l-date"></button>
      </div>
    </div>
    <div class="l-air hide">
      <div class="duo">
        <div>
          <span class="fl">便名</span>
          <input type="text" class="l-name">
        </div>
        <div>
          <span class="fl">座席クラス</span>
          <select class="l-cls empty"></select>
        </div>
      </div>
    </div>
    <div class="l-route hide">
      <span class="fl">発着</span>
      <div class="two">
        <input type="text" class="l-from" placeholder="発（羽田）">
        <span>→</span>
        <input type="text" class="l-to" placeholder="着（伊丹）">
      </div>
      <div class="l-chips hide"><span class="chips-l">最近使った場所（タップで入力）</span><div class="chips"></div></div>
    </div>
    <div class="l-pay hide">
      <span class="fl">支払</span>
      <div class="seg pay"><button type="button" class="on" data-v="個人">個人</button><button type="button" data-v="法人">法人</button><button type="button" data-v="支払なし">支払なし</button></div>
    </div>
    <div class="l-fare hide">
      <span class="fl">金額</span>
      <input type="text" class="l-amt" inputmode="numeric" placeholder="ガソリン代・ETC代">
    </div>
    <button type="button" class="rt l-rt hide">⇄ 往復にする（帰りを自動入力）</button>
  </div>
</template>

<!-- カレンダー -->
<div class="sheet hide" id="cal">
  <div class="sheet-in">
    <div class="cal-h">
      <button type="button" id="cal_prev">‹</button>
      <b id="cal_title"></b>
      <button type="button" id="cal_next">›</button>
    </div>
    <div class="cal-w"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="cal-g" id="cal_g"></div>
    <div class="cal-sel" id="cal_sel"></div>
    <div class="cal-btns">
      <button type="button" id="cal_cancel">やめる</button>
      <button type="button" id="cal_ok">決定</button>
    </div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LIFF_ID = '2011518319-ABM6yIOM';
  var HEADER  = '【旅費申請】';          // Code.gs が受け取る見出し（既存フォームと同じ）
  var MARK    = '（日帰り出張一括報告から送信）';   // Code.gs の isRakurakuText() が見る目印
  var PREVIEW = /[?&]preview=1/.test(location.search);  // PCでの見た目確認用（送信しない）
  // 受付先（Apps Script のウェブアプリ。LINEのWebhookと同じURL）
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxs0WXzhbnHdfmlzjYGmGBqtN4SPxKATK18uD8O4lhX9lL9FuJ3paP775mjoQwfwDJO/exec';

  var CLS = {
    '飛行機': ['エコノミー', 'クラスJ（JAL）', 'ビジネス', 'ファースト'],
    '新幹線': ['自由席', '指定席', 'グリーン', 'グランクラス']
  };
  var NAME_PH = { '飛行機': 'JAL〇〇便', '新幹線': 'のぞみ〇〇号' };
  var FROM_PH = { '飛行機': ['発（羽田）', '着（伊丹）'], '新幹線': ['発（東京）', '着（新大阪）'],
                  '在来線': ['発（品川）', '着（新宿）'], '車': ['発（自宅）', '着（現場）'] };

  var $ = function (id) { return document.getElementById(id); };
  var val = function (s) { return String(s == null ? '' : s).trim(); };
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };
  var circled = function (i) { return i < 20 ? String.fromCharCode(0x2460 + i) : String(i + 1); };   // ①②③…
  var myName = '';   // LINEの表示名。出張者の初期値に使う

  /* ---------- 使った場所を覚えておく（この端末の中だけ。サーバーには送らない） ----------
     places[手段] … 最近使った場所（新しい順・8件まで）
     lastFrom[手段] … 前回の行きの出発地 */
  var MEM_KEY = 'higaeri_places_v1';
  var mem = (function () {
    try { var o = JSON.parse(localStorage.getItem(MEM_KEY) || '{}') || {}; o.places = o.places || {}; o.lastFrom = o.lastFrom || {}; return o; }
    catch (e) { return { places: {}, lastFrom: {} }; }
  })();
  function remember() {
    each($('rows').children, function (row) {
      each(row.querySelector('.r-legs').children, function (w, i) {
        var m = segVal(w.querySelector('.l-mean'));
        if (!m) return;
        var fr = val(w.querySelector('.l-from').value), to = val(w.querySelector('.l-to').value);
        var list = mem.places[m] || [];
        [to, fr].forEach(function (x) {
          if (!x) return;
          list = [x].concat(list.filter(function (y) { return y !== x; }));
        });
        mem.places[m] = list.slice(0, 8);
        if (i === 0 && fr) mem.lastFrom[m] = fr;
      });
    });
    try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch (e) {}
  }

  function jp(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日' : '';
  }
  function wd(iso) {
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? '（' + '日月火水木金土'.charAt(new Date(+m[1], m[2] - 1, +m[3]).getDay()) + '）' : '';
  }
  /* 複数の日をまとめて短く書く：2026年9月5日/6日/10月1日 */
  function datesShort(list) {
    var prev = null;
    return list.map(function (iso) {
      var y = iso.slice(0, 4), m = Number(iso.slice(5, 7)), d = Number(iso.slice(8, 10)), t;
      if (prev && prev.y === y && prev.m === m) t = d + '日';
      else if (prev && prev.y === y) t = m + '月' + d + '日';
      else t = y + '年' + m + '月' + d + '日';
      prev = { y: y, m: m };
      return t;
    }).join('・');
  }

  /* ---------- カレンダー ----------
     kind: multi＝出張日（何日でも選べる）／one＝利用日（1日だけ） */
  var cal = { field: null, kind: 'multi', picked: [], cur: new Date() };

  function getDates(el) {
    var s = el.getAttribute('data-dates') || '';
    return s ? s.split(',') : [];
  }
  function setDates(el, list) {
    list = list.slice().sort();
    el.setAttribute('data-dates', list.join(','));
    el.classList.remove('bad');
    fieldText(el);
  }
  function fieldText(el) {
    var list = getDates(el), k = el.getAttribute('data-kind');
    el.classList.toggle('empty', !list.length);
    if (!list.length) el.textContent = el.getAttribute('data-ph');
    else if (k === 'one') el.textContent = jp(list[0]);   // 欄が狭いので曜日は出さない
    else el.textContent = datesShort(list) + (list.length > 1 ? '（' + list.length + '日）' : '');
  }
  function bindField(el, kind, ph) {
    el.setAttribute('data-kind', kind);
    el.setAttribute('data-ph', ph);
    el.onclick = function () { openCal(el); };
    fieldText(el);
    return el;
  }
  function openCal(el) {
    cal.field = el;
    cal.kind = el.getAttribute('data-kind');
    cal.picked = getDates(el);
    var base = cal.picked.length ? new Date(cal.picked[0] + 'T00:00:00') : new Date();
    cal.cur = new Date(base.getFullYear(), base.getMonth(), 1);
    drawCal();
    $('cal').classList.remove('hide');
  }
  function drawCal() {
    var y = cal.cur.getFullYear(), mo = cal.cur.getMonth();
    $('cal_title').textContent = y + '年' + (mo + 1) + '月';
    var head = new Date(y, mo, 1).getDay(), last = new Date(y, mo + 1, 0).getDate();
    var g = $('cal_g'); g.innerHTML = '';
    for (var i = 0; i < head; i++) { var b = document.createElement('div'); b.className = 'cd empty'; g.appendChild(b); }
    for (var d = 1; d <= last; d++) {
      var iso = y + '-' + p2(mo + 1) + '-' + p2(d);
      var c = document.createElement('div');
      c.className = 'cd' + (cal.picked.indexOf(iso) >= 0 ? ' on' : '');
      c.textContent = d;
      c.setAttribute('data-iso', iso);
      c.onclick = pickDay;
      g.appendChild(c);
    }
    var s = $('cal_sel'), list = cal.picked.slice().sort();
    if (!list.length) s.innerHTML = (cal.kind === 'one') ? '利用日を選んでください' : '出張日を選んでください（複数選べます）';
    else if (cal.kind === 'one') s.innerHTML = '<b>' + jp(list[0]) + wd(list[0]) + '</b>';
    else s.innerHTML = '<b>' + datesShort(list) + '</b>　' + list.length + '日';
    $('cal_ok').disabled = !list.length;
  }
  function pickDay() {
    var iso = this.getAttribute('data-iso'), i = cal.picked.indexOf(iso);
    if (cal.kind === 'one') cal.picked = [iso];
    else if (i >= 0) cal.picked.splice(i, 1);   // もう一度押すと外れる
    else cal.picked.push(iso);
    drawCal();
  }
  function setupCal() {
    $('cal_prev').onclick = function () { cal.cur.setMonth(cal.cur.getMonth() - 1); drawCal(); };
    $('cal_next').onclick = function () { cal.cur.setMonth(cal.cur.getMonth() + 1); drawCal(); };
    $('cal_cancel').onclick = function () { $('cal').classList.add('hide'); };
    $('cal').onclick = function (e) { if (e.target === $('cal')) $('cal').classList.add('hide'); };
    $('cal_ok').onclick = function () {
      if (!cal.picked.length) return;
      var el = cal.field;
      el.setAttribute('data-touched', '1');
      el.classList.remove('auto');
      setDates(el, cal.picked);
      $('cal').classList.add('hide');
      if (el.classList.contains('r-dates')) onTripDates(el.closest('.row'));
    };
  }

  /* ---------- 出張1件 ---------- */

  /* 出張日が決まったら、手で変えていない利用日に最初の出張日を入れる */
  function onTripDates(row) {
    var first = getDates(row.querySelector('.r-dates'))[0];
    if (!first) return;
    each(row.querySelector('.r-legs').children, function (w) {
      var d = w.querySelector('.l-date');
      if (!d.getAttribute('data-touched')) {
        setDates(d, [first]);
        d.classList.add('auto');   // 出張日から引っ張ってきた印
      }
    });
  }

  function renumberSubs(box, word) {
    var n = box.children.length;
    each(box.children, function (w, i) {
      w.querySelector('.sub-h b').textContent = word + circled(i);
      w.querySelector('.sub-h button').classList.toggle('hide', n === 1);
      var rt = w.querySelector('.l-rt');
      if (rt) rt.classList.toggle('hide', i !== 0 || !segVal(w.querySelector('.l-mean')));   // 往復ボタンは移動①にだけ
    });
  }

  /* 支払の区分：押したボタンだけを選ぶ。最初は「個人」 */
  function bindSeg(box, onPick) {
    // プルダウンのときは、選び方が違うだけで使い方は同じ
    if (box.tagName === 'SELECT') {
      box.onchange = function () {
        box.classList.toggle('empty', !box.value);
        box.classList.remove('bad', 'auto');
        $('err').textContent = '';
        if (onPick) onPick(box.value);
      };
      return;
    }
    each(box.children, function (b) {
      b.onclick = function () {
        each(box.children, function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        box.classList.remove('bad', 'auto');
        $('err').textContent = '';
        if (onPick) onPick(b.getAttribute('data-v'));
      };
    });
  }
  function setSeg(box, v) {
    if (box.tagName === 'SELECT') {
      box.value = v || '';
      box.classList.toggle('empty', !box.value);
      box.classList.remove('bad');
      return;
    }
    each(box.children, function (x) { x.classList.toggle('on', x.getAttribute('data-v') === v); });
    box.classList.remove('bad');
  }
  function segVal(box) {
    if (box.tagName === 'SELECT') return box.value;
    var on = box.querySelector('.on');
    return on ? on.getAttribute('data-v') : '';
  }

  function addLeg(row) {
    var w = $('tpl_leg').content.firstElementChild.cloneNode(true);
    bindSeg(w.querySelector('.pay'), function () {
      w.querySelector('.pay').setAttribute('data-touched', '1');   // 手で選んだら、もう勝手に変えない
      routeVis(w);
    });
    var d = bindField(w.querySelector('.l-date'), 'one', '利用日を選ぶ');
    var mean = w.querySelector('.l-mean');
    bindSeg(mean, function (m) {
      refreshLeg(w);
      var legs = row.querySelector('.r-legs').children;
      // 行き（移動①）の出発地が空なら、前回の出発地を入れておく
      var fr = w.querySelector('.l-from');
      if (w === legs[0] && !val(fr.value) && mem.lastFrom[m]) { fr.value = mem.lastFrom[m]; fr.classList.add('auto'); }
      // 1本目の手段を選んだら、まだ選んでいない2本目にも同じ手段を入れておく（帰りだけ違うときは選び直す）
      if (w === legs[0] && legs[1] && !segVal(legs[1].querySelector('.l-mean'))) {
        setSeg(legs[1].querySelector('.l-mean'), m);
        refreshLeg(legs[1]);
      }
    });
    // 発着：最後にさわった欄を覚えておく（場所ボタンの入れ先に使う）
    w.querySelector('.l-from').onfocus = function () { w._last = 'from'; };
    w.querySelector('.l-to').onfocus = function () { w._last = 'to'; };
    w.querySelector('.l-rt').onclick = function () { roundTrip(row, w); };
    w.querySelector('.l-del').onclick = function () { w.remove(); renumberSubs(row.querySelector('.r-legs'), '移動'); };
    row.querySelector('.r-legs').appendChild(w);
    renumberSubs(row.querySelector('.r-legs'), '移動');
    var first = getDates(row.querySelector('.r-dates'))[0];
    if (first) {
      setDates(d, [first]);
      d.classList.add('auto');   // 出張日から引っ張ってきた印
    }   // 日帰りなので、行きも帰りも出張日を入れておく（手で変えられる）
    return w;
  }

  /* 区間の手段に合わせて、明細の出し分け・便名の例・座席クラスの選択肢を入れ替える */
  /* 発着を出すか。飛行機・新幹線は必ず出す。在来線・車は「個人」で立て替えたときだけ */
  function routeVis(w) {
    var m = segVal(w.querySelector('.l-mean'));
    var pay = segVal(w.querySelector('.pay'));
    var personal = (pay === '個人');
    var show = !!m && (!!CLS[m] || personal);
    w.querySelector('.l-route').classList.toggle('hide', !show);
    // 在来線・車を自分で立て替えたときだけ、金額を聞く
    w.querySelector('.l-fare').classList.toggle('hide', !(m && !CLS[m] && personal));
    return show;
  }

  function refreshLeg(w) {
    var m = segVal(w.querySelector('.l-mean')), list = CLS[m];
    w.querySelector('.l-air').classList.toggle('hide', !list);
    w.querySelector('.l-day').classList.toggle('hide', !list);   // 利用日も飛行機・新幹線だけ     // 利用日・便名・座席は飛行機と新幹線だけ
    var payBox = w.querySelector('.pay');
    if (m && !payBox.getAttribute('data-touched')) setSeg(payBox, CLS[m] ? '個人' : '法人');
    routeVis(w);
    w.querySelector('.l-pay').classList.toggle('hide', !m);        // 支払もどの手段でも
    if (w.parentNode) renumberSubs(w.parentNode, '移動');
    if (m) {
      var ph = FROM_PH[m] || ['発', '着'];
      w.querySelector('.l-from').placeholder = ph[0];
      w.querySelector('.l-to').placeholder = ph[1];
      drawChips(w, m);
    }
    if (!list) {
      w.querySelector('.l-amt').placeholder = (m === '車') ? 'ガソリン代・ETC代' : '運賃';
      return;
    }
    var cls = w.querySelector('.l-cls'), cur = segVal(cls);
    cls.innerHTML = '';
    var head = document.createElement('option');
    head.value = ''; head.textContent = '選んでください';
    cls.appendChild(head);
    list.forEach(function (t) {
      var v = t.replace('（JAL）', '');
      var o = document.createElement('option');
      o.value = v; o.textContent = v;
      cls.appendChild(o);
    });
    bindSeg(cls);
    setSeg(cls, cur);   // 同じ名前のクラスがあれば選んだまま
    w.querySelector('.l-name').placeholder = NAME_PH[m];
  }

  /* 最近使った場所のボタン。発が空なら発へ、発が入っていれば着へ入れる */
  function drawChips(w, m) {
    var box = w.querySelector('.l-chips'), list = (mem.places[m] || []).slice(0, 6);
    box.classList.toggle('hide', !list.length);
    var g = box.querySelector('.chips');
    g.innerHTML = '';
    list.forEach(function (name) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.onclick = function () {
        var fr = w.querySelector('.l-from'), to = w.querySelector('.l-to'), el;
        if (!val(fr.value)) el = fr;
        else if (!val(to.value)) el = to;
        else el = (w._last === 'from') ? fr : to;
        el.value = name;
        el.classList.remove('bad', 'auto');
        $('err').textContent = '';
      };
      g.appendChild(b);
    });
  }

  /* 往復：移動①を逆向きにして移動②へ入れる（手段・利用日・座席クラス・支払も同じに） */
  function roundTrip(row, w) {
    var btn = w.querySelector('.l-rt'), label = '⇄ 往復にする（帰りを自動入力）';
    var fr = w.querySelector('.l-from'), to = w.querySelector('.l-to');
    var needRoute = !w.querySelector('.l-route').classList.contains('hide');
    if (needRoute && (!val(fr.value) || !val(to.value))) {
      if (!val(fr.value)) fr.classList.add('bad');
      if (!val(to.value)) to.classList.add('bad');
      btn.textContent = '先に移動①の発着を入れてください';
      setTimeout(function () { btn.textContent = label; }, 2200);
      return;
    }
    var legs = row.querySelector('.r-legs').children;
    var back = legs[1] || addLeg(row);
    var m = segVal(w.querySelector('.l-mean'));
    setSeg(back.querySelector('.l-mean'), m);
    refreshLeg(back);
    back.querySelector('.l-mean').classList.add('auto');

    var day = getDates(w.querySelector('.l-date'))[0];
    if (day) {
      var bd = back.querySelector('.l-date');
      setDates(bd, [day]);
      bd.setAttribute('data-touched', '1');
      bd.classList.add('auto');
    }
    var c = segVal(w.querySelector('.l-cls'));
    if (c) { setSeg(back.querySelector('.l-cls'), c); back.querySelector('.l-cls').classList.add('auto'); }
    setSeg(back.querySelector('.pay'), segVal(w.querySelector('.pay')));
    back.querySelector('.pay').setAttribute('data-touched', '1');
    routeVis(back);   // 支払が法人などなら、帰りの発着も隠す

    var bf = back.querySelector('.l-from'), bt = back.querySelector('.l-to');
    bf.value = val(to.value); bt.value = val(fr.value);
    bf.classList.add('auto'); bt.classList.add('auto');
    bf.classList.remove('bad'); bt.classList.remove('bad');

    btn.textContent = '✓ 帰りに入れました';
    setTimeout(function () { btn.textContent = label; }, 2500);
    back.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  function renumber() {
    var rows = $('rows').children;
    each(rows, function (r, i) {
      r.querySelector('.r-no').textContent = '出張' + circled(i);
      r.querySelector('.r-del').classList.toggle('hide', rows.length === 1);
    });
  }

  /* 会社名・出張者の欄。1つだけのときは×を出さない */
  function addLine(row, which, value) {
    var box = row.querySelector(which === 'co' ? '.r-cos' : '.r-whos');
    var el = $(which === 'co' ? 'tpl_co' : 'tpl_who').content.firstElementChild.cloneNode(true);
    var input = el.querySelector('input');
    input.value = value || '';
    el.querySelector('.w-del').onclick = function () {
      el.remove();
      trimDel(box);
      if (which === 'co') refreshBill(row);
    };
    box.appendChild(el);
    trimDel(box);
    return input;
  }
  function trimDel(box) {
    each(box.children, function (el) {
      el.querySelector('.w-del').classList.toggle('hide', box.children.length === 1);
    });
  }

  /* 会社が2社以上のときだけ「交通費の請求先」を出す。交通費は1社にしか付けられないため */
  function coNames(row) {
    var out = [];
    each(row.querySelectorAll('.r-co'), function (el) { if (val(el.value)) out.push(val(el.value)); });
    return out;
  }
  function refreshBill(row) {
    var cos = coNames(row), sel = row.querySelector('.r-bill'), cur = sel.value;
    row.querySelector('.r-billbox').classList.toggle('hide', cos.length < 2);
    sel.innerHTML = '';
    var head = document.createElement('option');
    head.value = ''; head.textContent = '選んでください';
    sel.appendChild(head);
    cos.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
    sel.value = (cos.indexOf(cur) >= 0) ? cur : '';
    sel.classList.toggle('empty', !sel.value);
  }

  function addRow() {
    var row = $('tpl_row').content.firstElementChild.cloneNode(true);
    $('rows').appendChild(row);

    // 会社名・出張者：2件目以降は1件目と同じ顔ぶれを入れておく
    var firstRow = $('rows').children[0];
    if (firstRow && firstRow !== row) {
      each(firstRow.querySelectorAll('.r-co'), function (el) { addLine(row, 'co', el.value); });
      each(firstRow.querySelectorAll('.r-who'), function (el) { addLine(row, 'who', el.value); });
    } else {
      addLine(row, 'co', '');
      addLine(row, 'who', myName);
    }
    row.querySelector('.r-addco').onclick = function () { addLine(row, 'co', '').focus(); refreshBill(row); };
    row.querySelector('.r-addwho').onclick = function () { addLine(row, 'who', '').focus(); };
    row.querySelector('.r-bill').onchange = function (e) {
      e.target.classList.toggle('empty', !e.target.value);
      e.target.classList.remove('bad');
    };
    refreshBill(row);

    bindField(row.querySelector('.r-dates'), 'multi', '日付を選ぶ');

    row.querySelector('.r-addleg').onclick = function () { addLeg(row); };

    var file = row.querySelector('.r-file');
    row.querySelector('.r-addph').onclick = function () { file.click(); };
    file.onchange = function () {
      each(file.files, function (f) { addPhoto(row, f); });
      file.value = '';   // 同じ写真をもう一度選べるように
    };

    row.querySelector('.r-del').onclick = function () { row.remove(); renumber(); };
    addLeg(row);   // まずは1つだけ。帰りは「⇄ 往復にする」か「＋ 移動を追加」で足す
    renumber();
    return row;
  }

  /* ---------- 写真 ---------- */
  var PHREQ = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);   // この申請の写真置き場

  /* 送る前に小さくする。領収書の文字が読めれば十分 */
  function shrink(file, cb) {
    var fr = new FileReader();
    fr.onerror = function () { cb(null); };
    fr.onload = function () {
      var src = String(fr.result);
      if (!/^image\//.test(file.type || '')) { cb(src.split(',')[1], file.type || 'application/octet-stream', ''); return; }
      var img = new Image();
      img.onerror = function () { cb(src.split(',')[1], file.type, src); };
      img.onload = function () {
        var max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        try {
          var out = cv.toDataURL('image/jpeg', 0.82);
          cb(out.split(',')[1], 'image/jpeg', out);
        } catch (e) { cb(src.split(',')[1], file.type, src); }
      };
      img.src = src;
    };
    fr.readAsDataURL(file);
  }

  /* 1枚ぶん。選んだ時点で送ってしまう */
  function addPhoto(row, file) {
    var chip = document.createElement('div');
    chip.className = 'ph-chip';
    chip.innerHTML = '<img alt=""><span class="st">読み込み中…</span>';
    row.querySelector('.r-phlist').appendChild(chip);
    var thumb = chip.querySelector('img'), st = chip.querySelector('.st');

    shrink(file, function (b64, mime, preview) {
      if (!b64) { chip.className = 'ph-chip ng'; st.textContent = '読み込めません'; return; }
      if (preview) thumb.src = preview;
      st.textContent = '送信中…';
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'upload', reqId: PHREQ, accessToken: liff.getAccessToken(),
                               label: '日帰り', name: file.name || 'photo.jpg', mime: mime, data: b64 })
      })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok || !j.url) { chip.className = 'ph-chip ng'; st.textContent = '送れません'; return; }
          chip.className = 'ph-chip ok';
          chip.setAttribute('data-url', j.url);
          st.textContent = '添付しました';
          var x = document.createElement('button');
          x.type = 'button'; x.className = 'x'; x.textContent = '×';
          x.onclick = function () { chip.remove(); };
          chip.appendChild(x);
        })
        .catch(function () { chip.className = 'ph-chip ng'; st.textContent = '送れません'; });
    });
  }

  /* ---------- 送る文章をつくる ---------- */
  function build() {
    each(document.querySelectorAll('.bad'), function (x) { x.classList.remove('bad'); });
    var rows = $('rows').children, L = [HEADER], first = null;
    function bad(el, msg) { el.classList.add('bad'); if (!first) first = { el: el, msg: msg }; }

    each(rows, function (row, i) {
      var no = row.querySelector('.r-no').textContent;

      var cos = [];
      each(row.querySelectorAll('.r-co'), function (el) { if (val(el.value)) cos.push(val(el.value)); });
      if (!cos.length) bad(row.querySelector('.r-co'), no + 'の会社名をご記入ください。');

      var whos = [];
      each(row.querySelectorAll('.r-who'), function (el) { if (val(el.value)) whos.push(val(el.value)); });
      if (!whos.length) bad(row.querySelector('.r-who'), no + 'の出張者をご記入ください。');

      var place = row.querySelector('.r-place');
      if (!val(place.value)) bad(place, no + 'の出張先をご記入ください。');

      var df = row.querySelector('.r-dates'), dates = getDates(df);
      if (!dates.length) bad(df, no + 'の出張日を選んでください。');

      // 2社以上なら、交通費をどちらに付けるかは必ず決めてもらう
      var bill = row.querySelector('.r-bill').value;
      if (cos.length > 1 && !bill) bad(row.querySelector('.r-bill'), no + 'の交通費の請求先を選んでください。');

      var legs = [];
      each(row.querySelector('.r-legs').children, function (w) {
        var sub = no + 'の' + w.querySelector('.sub-h b').textContent;
        var mean = w.querySelector('.l-mean'), m = segVal(mean);
        if (!m) { bad(mean, sub + 'の手段を選んでください。'); return; }
        if (!CLS[m]) {
          var p0 = segVal(w.querySelector('.pay'));
          var f0 = val(w.querySelector('.l-from').value), t0 = val(w.querySelector('.l-to').value);
          var vis = !w.querySelector('.l-route').classList.contains('hide');
          var route = (vis && (f0 || t0)) ? ' ' + f0 + '→' + t0 : '';   // 隠れているときは載せない
          var amtVis = !w.querySelector('.l-fare').classList.contains('hide');
          var amt = val(w.querySelector('.l-amt').value).replace(/円$/, '');
          var money = (amtVis && amt) ? ' ' + amt + '円' : '';
          legs.push({ k: '', m: m, pay: p0, route: route, money: money, s: m + route + money + '　／ ' + p0 });
          return;
        }   // 在来線・車は手段だけ
        var d = w.querySelector('.l-date'), nm = w.querySelector('.l-name'), cls = w.querySelector('.l-cls');
        var fr = w.querySelector('.l-from'), to = w.querySelector('.l-to');
        var day = getDates(d)[0] || '';
        if (!day) bad(d, sub + 'の利用日を選んでください。');
        if (!val(nm.value)) bad(nm, sub + 'の便名をご記入ください。');
        if (!segVal(cls)) bad(cls, sub + 'の座席クラスを選んでください。');
        if (!val(fr.value)) bad(fr, sub + 'の出発地をご記入ください。');
        if (!val(to.value)) bad(to, sub + 'の到着地をご記入ください。');
        legs.push({ k: day, m: m, detail: true, pay: segVal(w.querySelector('.pay')),
                    s: (day ? jp(day) + wd(day) : '') + ' ' + m + ' ' +
                    val(fr.value) + '→' + val(to.value) + ' ' + val(nm.value) + '（' + segVal(cls) + '）' +
                    ' ／ ' + segVal(w.querySelector('.pay')) });
      });
      if (!row.querySelector('.r-legs').children.length) bad(row.querySelector('.r-addleg'), no + 'の移動を追加してください。');

      var work = row.querySelector('.r-work');
      if (!val(work.value)) bad(work, no + 'の仕事内容をご記入ください。');

      if (rows.length > 1) L.push((i ? '\n' : '') + '■' + no);
      if (cos.length === 1) L.push('会社名：' + cos[0]);
      else { L.push('会社名：'); cos.forEach(function (c) { L.push('・' + c); }); }
      if (whos.length === 1) L.push('出張者：' + whos[0]);
      else { L.push('出張者：'); whos.forEach(function (w) { L.push('・' + w); }); }
      L.push('出張先：' + val(place.value));
      if (dates.length === 1) L.push('出張日：' + jp(dates[0]) + wd(dates[0]));
      else { L.push('出張日：'); dates.forEach(function (d) { L.push('・' + jp(d) + wd(d)); }); }
      // 在来線・車だけなら「移動手段：在来線」と1行に。飛行機・新幹線があれば区間ごとに1行
      if (cos.length > 1 && bill) L.push('交通費の請求先：' + bill);
      // 飛行機・新幹線がなく、支払も発着も揃っていれば1行で。そうでなければ区間ごとに1行
      var hasDetail = legs.some(function (x) { return x.detail; });
      var samePay = legs.length > 0 && legs.every(function (x) { return x.pay === legs[0].pay; });
      var noRoute = legs.every(function (x) { return !x.route; });
      var noMoney = legs.every(function (x) { return !x.money; });
      if (!hasDetail && samePay && noRoute && noMoney) {
        L.push('移動手段：' + legs.map(function (x) { return x.m; }).filter(function (v, j, a) { return a.indexOf(v) === j; }).join('・')
               + '　／ ' + legs[0].pay);
      } else {
        L.push('移動手段：');
        legs.forEach(function (x) { L.push('・' + x.s); });   // 入力した順（行き→帰り）のまま
      }
      L.push('仕事内容：' + val(work.value));

      var shots = [];
      each(row.querySelectorAll('.ph-chip.ok'), function (c) { shots.push(c.getAttribute('data-url')); });
      if (shots.length) { L.push('添付画像：'); shots.forEach(function (u) { L.push('・' + u); }); }
    });

    if (document.querySelector('.ph-chip:not(.ok):not(.ng)')) {
      return { err: '写真を送っています。少し待ってからもう一度押してください。' };
    }

    if (first) {
      first.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return { err: first.msg };
    }
    L.push(MARK);
    return { text: L.join('\n') };
  }

  function show(t) { var m = $('msg'); m.textContent = t; m.classList.remove('hide'); }

  /* ---------- 起動 ---------- */
  function start() {
    setupCal();
    addRow();
    // 直し始めたら、エラー表示と赤枠を消す
    document.addEventListener('input', function (e) {
      $('err').textContent = '';
      if (e.target.classList) e.target.classList.remove('bad', 'auto');
      // 会社名を書き換えたら、交通費の請求先の選択肢も入れ替える
      if (e.target.classList && e.target.classList.contains('r-co')) {
        var r = e.target.closest('.row');
        if (r) refreshBill(r);
      }
    });
    document.addEventListener('change', function (e) { $('err').textContent = ''; if (e.target.classList) e.target.classList.remove('bad'); });
    $('addrow').onclick = function () {
      var r = addRow();
      r.scrollIntoView({ block: 'start', behavior: 'smooth' });
    };

    var draft = '', draftId = '';
    $('next').onclick = function () {
      var r = build();
      $('err').textContent = r.err || '';
      if (r.err) return;
      draft = r.text;
      draftId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);   // 二重送信よけの目印
      $('preview').textContent = draft;
      $('form').classList.add('hide');
      $('confirm').classList.remove('hide');
      window.scrollTo(0, 0);
    };
    $('back').onclick = function () {
      $('confirm').classList.add('hide');
      $('form').classList.remove('hide');
    };
    function failed(e) {
      $('send').disabled = false;
      $('send').textContent = '送信する';
      show('送信できませんでした。もう一度お試しください。（' + e + '）');
    }
    /* 従来の送り方：トークに申請文を送る（受付カードは返信で届く） */
    function viaTalk() {
      if (draft.length > 5000) { failed('内容が長すぎます。出張を分けて送ってください'); return; }
      liff.sendMessages([{ type: 'text', text: draft }])
        .then(function () { liff.closeWindow(); })
        .catch(failed);
    }
    /* 通常：受付先へ直接送る。トークに申請文は出ず、受付カードだけが届く */
    $('send').onclick = function () {
      remember();   // 次回のために、使った場所をこの端末に覚えておく
      if (PREVIEW) { console.log(draft); show('プレビューのため送信していません。'); return; }
      $('send').disabled = true;
      $('send').textContent = '送信中…';
      var closed = false, answered = false;
      function bye() { closed = true; try { liff.closeWindow(); } catch (e) { show('送信しました。この画面を閉じてください。'); } }
      // 受付が終わるのを待たずに閉じる。送信は keepalive で、画面を閉じたあとも続く
      var timer = setTimeout(bye, 1200);
      fetch(EXEC_URL, {
        method: 'POST',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // この形なら事前確認なしで送れる
        body: JSON.stringify({ type: 'rakuraku', id: draftId, accessToken: liff.getAccessToken(), text: draft, ch: (new URLSearchParams(location.search).get('ch') || '') })
      })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          clearTimeout(timer);
          answered = true;
          if (j.ok) { bye(); return; }
          if (closed) return;                      // もう閉じたあとなら、何もしない
          if (j.fallback) { viaTalk(); return; }   // 送信数の上限などで届けられなかったとき
          failed(j.error || 'error');
        })
        .catch(function () {
          clearTimeout(timer);
          // 受け取ってもらえたか分からないまま送り直すと、台帳に同じ出張が2行立つ。
          // まだ閉じていないときだけ、従来の送り方に切り替える
          if (!answered && !closed) viaTalk();
        });
    };
    $('form').classList.remove('hide');
  }

  if (PREVIEW) { start(); return; }
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isInClient()) { show('このページはLINEアプリの中で開いてください。'); return; }
    // 出張者の初期値にLINEの表示名を使う。取れなくても入力はできる
    liff.getProfile()
      .then(function (p) { myName = p.displayName || ''; })
      .catch(function () {})
      .then(start);
  }).catch(function (e) { show('起動に失敗しました。（' + e + '）'); });
})();
</script>
